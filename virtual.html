<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Access Restricted</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --accent:#ff003c;
    --bg:#050505;
    --glass:rgba(255,255,255,0.04);
    --border:rgba(255,255,255,0.08);
    --neon:#00f2ff;
    --success:#00ffa3;
    --gold:#fbbf24;
    --spring:cubic-bezier(0.34,1.56,0.64,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:'Inter',sans-serif;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:var(--bg);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    color:white;
}

/* Background Effects */
body::before{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:radial-gradient(circle, rgba(255,0,60,0.25), transparent 70%);
    top:-120px;
    right:-100px;
    filter:blur(20px);
}

body::after{
    content:'';
    position:absolute;
    width:300px;
    height:300px;
    background:radial-gradient(circle, rgba(0,242,255,0.15), transparent 70%);
    bottom:-100px;
    left:-100px;
    filter:blur(25px);
}

/* Animated Grid */
.grid{
    position:absolute;
    inset:0;
    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:35px 35px;
    mask-image:linear-gradient(to bottom, transparent, black);
}

/* Popup Card */
.popup{
    width:90%;
    max-width:360px;
    background:rgba(10,10,10,0.85);
    border:1px solid var(--border);
    backdrop-filter:blur(18px);
    border-radius:35px;
    padding:35px 25px;
    text-align:center;
    position:relative;
    z-index:2;
    overflow:hidden;
    box-shadow:
    0 0 40px rgba(255,0,60,0.15),
    inset 0 0 30px rgba(255,255,255,0.02);
}

/* Glow Ring */
.popup::before{
    content:'';
    position:absolute;
    inset:-2px;
    border-radius:35px;
    padding:1px;
    background:linear-gradient(135deg, rgba(255,0,60,0.6), rgba(0,242,255,0.3));
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

.warning-icon{
    width:90px;
    height:90px;
    margin:auto;
    margin-bottom:22px;
    border-radius:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,0,60,0.08);
    border:1px solid rgba(255,0,60,0.25);
    box-shadow:0 0 25px rgba(255,0,60,0.2);
}

.warning-icon i{
    font-size:2.8rem;
    color:var(--accent);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
}

.title{
    font-size:1.4rem;
    font-weight:900;
    margin-bottom:15px;
    letter-spacing:1px;
}

.message{
    color:#aaa;
    font-size:0.92rem;
    line-height:1.7;
    margin-bottom:28px;
}

.support-box{
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:20px;
    padding:14px;
    margin-bottom:25px;
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
}

.support-box i{
    color:var(--neon);
    font-size:1.2rem;
}

.support-text{
    font-size:0.75rem;
    color:#bbb;
    line-height:1.5;
}

/* Close Button */
.close-btn{
    width:100%;
    border:none;
    outline:none;
    background:linear-gradient(135deg, var(--accent), #7a001f);
    color:white;
    padding:18px;
    border-radius:22px;
    font-weight:900;
    font-size:0.9rem;
    letter-spacing:1px;
    cursor:pointer;
    transition:0.25s var(--spring);
    box-shadow:0 10px 25px rgba(255,0,60,0.25);
}

.close-btn:active{
    transform:scale(0.94);
}

/* Small Label */
.small-label{
    margin-top:18px;
    font-size:0.65rem;
    color:#555;
    letter-spacing:1px;
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="popup">

    <div class="warning-icon">
        <i class="fa-solid fa-location-crosshairs"></i>
    </div>

    <div class="title">ACCESS RESTRICTED</div>

    <div class="message">
        This casino game is not available in your country.<br><br>
        Please disable any location changer, VPN service, or contact customer support for assistance.
    </div>

    <div class="support-box">
        <i class="fa-solid fa-headset"></i>
        <div class="support-text">
            Our security system detected an unsupported region connection attempt.
        </div>
    </div>

    <button class="close-btn" onclick="window.location.href='home.html'">
        CLOSE & RETURN
    </button>

    <div class="small-label">
        AVIATOR GENIUS SECURITY SYSTEM
    </div>

</div>

</body>
</html>
