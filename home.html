<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Genius - Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --accent: #ff003c; 
            --bg: #050505; 
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f2ff;
            --success: #00ffa3; 
            --error: #ff2d55;
            --gold: #fbbf24;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; box-sizing: border-box; }

        body { 
            background: var(--bg);
            color: white; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 60, 0.1) 0%, transparent 50%);
        }

        /* --- APK DOWNLOAD BANNER --- */
        .download-box {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 350px; z-index: 50;
        }
        .apk-btn {
            width: 100%; padding: 14px; background: rgba(0, 242, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 20px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            color: var(--neon-blue); text-decoration: none; backdrop-filter: blur(10px);
        }
        .apk-title { font-size: 0.75rem; font-weight: 900; letter-spacing: 1px; }

        /* --- HEADER --- */
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .user-capsule { 
            display: flex; align-items: center; gap: 12px; background: var(--glass); 
            padding: 6px 18px 6px 6px; border-radius: 50px; border: 1px solid var(--border); 
            backdrop-filter: blur(15px);
        }
        .profile-img-wrap { width: 38px; height: 38px; border-radius: 50%; position: relative; border: 2px solid var(--accent); }
        .profile-img-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .led-status { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; background: var(--success); border-radius: 50%; border: 2px solid var(--bg); box-shadow: 0 0 10px var(--success); }
        
        .user-bal { font-size: 1rem; font-weight: 900; color: #fff; }
        .user-label { font-size: 0.55rem; color: #666; font-weight: 800; text-transform: uppercase; }

        /* --- GAME HUB (BENTO GRID) --- */
        .game-hub { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -40%); 
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 15px; 
            width: 90%; max-width: 400px;
        }
        .game-card { position: relative; border-radius: 28px; overflow: hidden; height: 150px; transition: 0.3s var(--spring); border: 1px solid var(--border); }
        .game-card.aviator { grid-column: span 2; height: 160px; background: linear-gradient(135deg, var(--accent), #600); }
        .game-card.virtual { background: linear-gradient(135deg, #1d4ed8, #001); }
        .game-card.mines { background: linear-gradient(135deg, #444, #111); }
        
        .game-content { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; }
        .game-content i { font-size: 2.5rem; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4)); }
        .game-label { font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }

        /* --- FOOTER NAVIGATION --- */
        .nav-bar {
            position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 380px; display: flex; justify-content: space-between; align-items: center;
        }
        .nav-btn {
            width: 65px; height: 65px; border-radius: 22px; background: var(--glass);
            border: 1px solid var(--border); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; color: #fff; font-size: 1.2rem;
            backdrop-filter: blur(15px);
        }
        .nav-btn.special { background: rgba(255, 0, 60, 0.1); border-color: rgba(255, 0, 60, 0.3); color: var(--accent); }
        .nav-label { font-size: 0.5rem; font-weight: 900; margin-top: 5px; }

        /* --- TOAST & MODALS --- */
        #dl-toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: var(--neon-blue); color: #000; padding: 12px 25px; 
            border-radius: 50px; font-weight: 900; font-size: 0.75rem; z-index: 30000;
        }
        
        #m-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 20000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .m-timer { font-size: 4rem; font-weight: 900; color: var(--accent); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .modal-card { background: #111; padding: 35px; border-radius: 35px; border: 1px solid var(--border); width: 85%; text-align: center; }
        
        .ticker-container { position: fixed; bottom: 0; width: 100%; background: #000; height: 45px; display: flex; align-items: center; border-top: 1px solid var(--border); }
        .ticker-move { display: flex; white-space: nowrap; animation: ticker 40s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .bouncy { transition: 0.2s var(--spring); }
        .bouncy:active { transform: scale(0.92); }
        
        .wallet-trigger { width: 48px; height: 48px; border-radius: 18px; background: var(--accent); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        .dropdown-menu { position: absolute; top: 65px; right: 0; width: 220px; background: #0a0a0a; border: 1px solid var(--border); border-radius: 25px; overflow: hidden; opacity: 0; visibility: hidden; transform: translateY(-15px); transition: 0.3s; z-index: 1000; }
        .dropdown-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .menu-item { padding: 16px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; }

        #notif-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .notif-card { background: #0a0a0a; width: 100%; max-width: 400px; border-radius: 35px; padding: 30px; border: 1px solid var(--border); }
        .notif-item { 
            background: var(--glass); padding: 18px; border-radius: 20px; margin-bottom: 15px; 
            border: 1px solid var(--border); transition: transform 0.3s var(--spring), opacity 0.3s; 
            position: relative; overflow: hidden;
        }
        .notif-photo { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="dl-toast" style="display:none">DOWNLOAD IN PROGRESS</div>

    <div id="m-overlay">
        <i class="fa-solid fa-jet-fighter m-icon" style="font-size: 3rem; color: var(--accent); margin-bottom: 20px;"></i>
        <h2>SYSTEM TUNING</h2>
        <div class="m-timer" id="m-timer">05</div>
        <p style="font-size: 0.7rem; color: #666;">Optimizing for peak altitude...</p>
    </div>

    <div class="modal-overlay" id="sessionModal">
        <div class="modal-card">
            <i class="fa-solid fa-shield-virus" style="font-size: 3rem; color: var(--error); margin-bottom: 15px;"></i>
            <h3>Session Clash</h3>
            <p style="opacity: 0.6; font-size: 0.9rem;">New login detected on another terminal.</p>
            <button class="bouncy" style="background: var(--accent); color: white; width:100%; padding:18px; border-radius:18px; border:none; font-weight:800;" onclick="confirmLogout()">Re-Authenticate</button>
        </div>
    </div>

    <div class="header">
        <div class="user-capsule bouncy" onclick="location.href='profile.html'">
            <div class="profile-img-wrap">
                <img id="user-avatar" src="https://ui-avatars.com/api/?name=U&background=ff003c&color=fff">
                <div id="led-light" class="led-status"></div>
            </div>
            <div class="user-info" style="display:flex; flex-direction:column">
                <span class="user-label">Wallet</span>
                <span class="user-bal">₦<span id="balance">0.00</span></span>
            </div>
        </div>

        <div style="display:flex; gap: 12px; align-items: center;">
            <div id="admin-gate" class="bouncy" onclick="handleAdminEntry()" style="display:none; color: var(--gold); border: 1px solid var(--gold); padding: 8px 15px; border-radius: 50px; font-size: 0.6rem; font-weight: 900;">ADMIN</div>
            
            <div class="wallet-container" style="position:relative">
                <div class="wallet-trigger bouncy" onclick="toggleWallet()"><i class="fa-solid fa-plus"></i></div>
                <div class="dropdown-menu" id="walletMenu">
                    <div class="menu-item bouncy" onclick="location.href='deposit.html'"><i class="fa-solid fa-wallet" style="color:var(--success)"></i> Deposit</div>
                    <div class="menu-item bouncy" onclick="location.href='withdraw.html'"><i class="fa-solid fa-money-bill-transfer" style="color:var(--error)"></i> Withdraw</div>
                    <div class="menu-item bouncy" onclick="location.href='history.html'"><i class="fa-solid fa-clock-rotate-left"></i> Transaction History</div>
                </div>
            </div>
        </div>
    </div>

    <div class="download-box">
        <a href="app-release.apk" download class="apk-btn bouncy" onclick="showDlToast()">
            <i class="fa-solid fa-bolt"></i>
            <span class="apk-title">INSTALL GENIUS MOBILE APP</span>
        </a>
    </div>

    <div class="game-hub">
        <div class="game-card aviator bouncy" onclick="location.href='game.html'">
            <div class="game-content"><i class="fa-solid fa-plane-up"></i><span class="game-label">Aviator Elite</span></div>
        </div>
        <div class="game-card virtual bouncy" onclick="location.href='virtual.html'">
            <div class="game-content"><i class="fa-solid fa-chart-line"></i><span class="game-label">Virtuals</span></div>
        </div>
        <div class="game-card mines bouncy" onclick="location.href='mines.html'">
            <div class="game-content"><i class="fa-solid fa-burst"></i><span class="game-label">Mines</span></div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-btn bouncy" onclick="location.href='support.html'"><i class="fa-solid fa-headset"></i><span class="nav-label">Support</span></div>
        <div class="nav-btn special bouncy" onclick="location.href='bonus.html'"><i class="fa-solid fa-satellite-dish"></i><span class="nav-label">Signals</span></div>
        <div class="nav-btn bouncy" onclick="openNotif()">
            <i class="fa-solid fa-bell"></i>
            <div id="notif-dot" class="notif-dot" style="display:none; position:absolute; top:15px; right:15px; width:8px; height:8px; background:var(--accent); border-radius:50%"></div>
            <span class="nav-label">Alerts</span>
        </div>
        <div class="nav-btn bouncy" style="color: var(--error)" onclick="showModal('logoutModal')"><i class="fa-solid fa-power-off"></i><span class="nav-label">Exit</span></div>
    </div>

    <div id="notif-panel">
        <div class="notif-card" id="notifCard">
            <h3 style="margin:0 0 20px; color: var(--accent);">Briefings</h3>
            <div id="notif-list" style="max-height: 50vh; overflow-y: auto;"></div>
            <button class="bouncy" style="width:100%; padding:18px; border-radius:20px; border:none; background:var(--accent); color:white; font-weight:800; margin-top:15px;" onclick="closeNotif()">DISMISS</button>
        </div>
    </div>

    <div class="modal-overlay" id="logoutModal" onclick="closeModal('logoutModal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <i class="fa-solid fa-door-open" style="font-size: 2.5rem; color: var(--error); margin-bottom: 15px;"></i>
            <h3>Terminate Session?</h3>
            <button class="bouncy" style="background: var(--error); color: white; width:100%; padding:16px; border-radius:15px; border:none; font-weight:800" onclick="confirmLogout()">LOGOUT</button>
            <button class="bouncy" style="background: transparent; color: #555; width:100%; padding:16px; border-radius:15px; border:none; margin-top:5px" onclick="closeModal('logoutModal')">STAY</button>
        </div>
    </div>

    <div class="ticker-container"><div class="ticker-move" id="ticker-content"></div></div>

    <script>
        var _supa;
        var userEmail = localStorage.getItem('user_email');
        var lastBalance = null;
        let startX = 0;
        const CONFIG_ID = "f4c6da92-d822-4e30-8a93-b90c7df78390";

        window.onload = async function() {
            if(!userEmail) { location.href='login.html'; return; }
            _supa = getClient();
            await loadData();
            await checkMaintenance();
            checkNotifications();
            setInterval(loadData, 4000); 
            setInterval(checkNotifications, 10000);
            setInterval(checkMaintenance, 15000);
            generateTicker();
        };

        function showDlToast() {
            const t = document.getElementById('dl-toast');
            t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 4000);
        }

        async function checkMaintenance() {
            const { data } = await _supa.from('system_config').select('maintenance_mode').eq('id', CONFIG_ID).maybeSingle();
            const role = localStorage.getItem('user_role');
            if (data && data.maintenance_mode === true && role !== 'ADMIN') {
                const overlay = document.getElementById('m-overlay');
                if (overlay.style.display !== 'flex') {
                    overlay.style.display = 'flex';
                    startMaintenanceTimer();
                }
            } else {
                document.getElementById('m-overlay').style.display = 'none';
            }
        }

        function startMaintenanceTimer() {
            let timeLeft = 5;
            const timerEl = document.getElementById('m-timer');
            const interval = setInterval(() => {
                timeLeft--;
                if(timerEl) timerEl.innerText = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                if (timeLeft <= 0) { clearInterval(interval); location.href = 'maintain.html'; }
            }, 1000);
        }

        async function loadData() {
            const localSessId = localStorage.getItem('my_session_id');
            const { data } = await _supa.from('profiles').select('*').eq('email', userEmail).single();
            if(data) {
                if (data.current_session_id && data.current_session_id !== localSessId) { showModal('sessionModal'); return; }
                const balance = parseFloat(data.balance || 0);
                document.getElementById('balance').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2});
                const led = document.getElementById('led-light');
                if (lastBalance !== null && balance !== lastBalance) {
                    led.className = balance > lastBalance ? 'led-status led-active' : 'led-status led-error';
                    setTimeout(() => { led.className = 'led-status'; }, 3000);
                }
                lastBalance = balance;
                if(data.avatar_url) document.getElementById('user-avatar').src = data.avatar_url;
                document.getElementById('admin-gate').style.display = (data.role === 'ADMIN') ? 'block' : 'none';
                localStorage.setItem('user_id', data.id);
                localStorage.setItem('user_role', data.role);
            }
        }

        async function checkNotifications() {
            const userId = localStorage.getItem('user_id');
            const { data: readData } = await _supa.from('notification_reads').select('notification_id').eq('user_id', userId);
            const readIds = readData ? readData.map(r => r.notification_id) : [];
            const { data: allNotifs } = await _supa.from('notifications').select('id');
            const unread = (allNotifs || []).filter(n => !readIds.includes(n.id));
            document.getElementById('notif-dot').style.display = (unread.length > 0) ? 'block' : 'none';
        }

        async function openNotif() {
            const panel = document.getElementById('notif-panel');
            const userId = localStorage.getItem('user_id');
            panel.style.display = 'flex';

            const { data: readData } = await _supa.from('notification_reads').select('notification_id').eq('user_id', userId);
            const readIds = readData ? readData.map(r => r.notification_id) : [];
            const { data: messages } = await _supa.from('notifications').select('*').order('created_at', { ascending: false });
            const activeMessages = (messages || []).filter(m => !readIds.includes(m.id));
            
            const list = document.getElementById('notif-list');
            if(activeMessages.length === 0) {
                list.innerHTML = `<p style="opacity:0.4; text-align:center">No active signals.</p>`;
                return;
            }

            list.innerHTML = activeMessages.map(n => `
                <div class="notif-item" ontouchstart="hStart(event)" ontouchmove="hMove(event, this, '${n.id}')">
                    <p style="margin:0; font-size:0.85rem">${n.message}</p>
                    ${n.image_url ? `<img src="${n.image_url}" class="notif-photo">` : ''}
                </div>`).join('');
        }

        function hStart(e) { startX = e.touches[0].clientX; }
        async function hMove(e, el, id) {
            let diff = e.touches[0].clientX - startX;
            if(diff < -80) { // Swipe Left Logic
                el.style.transform = "translateX(-120%)";
                el.style.opacity = "0";
                setTimeout(async () => {
                    await _supa.from('notification_reads').insert([{ user_id: localStorage.getItem('user_id'), notification_id: id }]);
                    openNotif(); 
                    checkNotifications();
                }, 300);
            }
        }

        function closeNotif() { document.getElementById('notif-panel').style.display = 'none'; }
        function handleAdminEntry() { if(localStorage.getItem('user_role')==='ADMIN') location.href='admin-shield.html'; }
        function toggleWallet() { document.getElementById('walletMenu').classList.toggle('show'); }
        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function confirmLogout() { localStorage.clear(); location.href = 'login.html'; }

        function generateTicker() {
            const wrap = document.getElementById('ticker-content');
            let h = '';
            for(let i=0; i<15; i++) h += `<div style="padding:0 30px; font-size:0.75rem">🚀 Player_${Math.floor(Math.random()*9999)} altitude <span style="color:var(--success)">${(Math.random()*20).toFixed(2)}x</span></div>`;
            wrap.innerHTML = h + h;
        }

        window.onclick = e => { if (!e.target.closest('.wallet-container')) document.getElementById('walletMenu').classList.remove('show'); }
    </script>
</body>
</html>
