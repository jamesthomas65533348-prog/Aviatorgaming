<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRINEX - Phase 1 Mining</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #007bff;
            --bg: #02050a;
            --card: #0d1930;
            --success: #00ff88;
            --danger: #ff3366;
            --trinex: #a855f7;
            --gold: #fbbf24;
            --spring: cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }

        /* --- PREVENT SELECTION & HIGHLIGHTS --- */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            outline: none;
        }
        input { user-select: auto !important; -webkit-user-select: auto !important; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 10%, #161b33 0%, #02050a 100%);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        /* --- TRINEX LOGO DESIGN --- */
        .trinex-logo {
            width: 80px; height: 80px;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px;
        }
        .logo-diamond {
            position: absolute;
            width: 60px; height: 60px;
            border: 3px solid var(--trinex);
            transform: rotate(45deg);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            border-radius: 8px;
        }
        .logo-x {
            font-size: 2.2rem; font-weight: 900;
            color: white; z-index: 2;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 0 0 10px var(--trinex);
        }

        /* --- BOUNCY TOAST --- */
        #custom-toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(13, 25, 48, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--trinex); color: white;
            padding: 15px 25px; border-radius: 20px; z-index: 10000;
            font-weight: 800; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transition: 0.6s var(--spring); display: flex; align-items: center; gap: 12px;
            width: 90%; max-width: 400px;
        }
        #custom-toast.show { top: 30px; }

        /* --- REGISTRATION SCREEN --- */
        #reg-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000;
            display: none; flex-direction: column; justify-content: center; align-items: center; padding: 30px;
        }

        .input-box {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 18px; border-radius: 18px; color: white; width: 100%; max-width: 350px;
            margin-bottom: 15px; font-weight: 600; font-size: 1rem; transition: 0.3s;
        }
        .input-box:focus { border-color: var(--trinex); background: rgba(255,255,255,0.08); }

        /* --- DASHBOARD --- */
        .countdown-top { 
            font-size: 0.7rem; color: #8492a6; margin-bottom: 8px; 
            text-transform: uppercase; letter-spacing: 2px; font-weight: 800;
        }
        #phase-timer { color: var(--gold); }

        .phase-header {
            background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 8px 20px; border-radius: 50px; font-size: 0.75rem;
            font-weight: 900; color: var(--trinex); margin-bottom: 25px;
        }

        .balance-section { text-align: center; margin: 10px 0; }
        .balance-amount { font-size: 3.5rem; font-weight: 900; letter-spacing: -1px; }

        /* --- MINING CIRCLE --- */
        .mining-container {
            position: relative; width: 280px; height: 280px;
            display: flex; justify-content: center; align-items: center; margin: 30px 0;
        }
        svg { position: absolute; transform: rotate(-90deg); width: 100%; height: 100%; }
        circle { fill: none; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 817; stroke-dashoffset: 817; transition: 0.1s linear; }
        .bg-circle { stroke: rgba(255,255,255,0.05); stroke-dashoffset: 0; }
        .progress-circle { stroke: var(--trinex); filter: drop-shadow(0 0 10px var(--trinex)); }

        #mining-btn {
            width: 200px; height: 200px; border-radius: 50%;
            background: linear-gradient(135deg, var(--trinex), #6366f1);
            border: none; color: white; font-weight: 900; font-size: 1.1rem;
            cursor: pointer; box-shadow: 0 20px 40px rgba(168, 85, 247, 0.3);
            transition: 0.4s var(--spring); z-index: 2;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-bounce:active { transform: scale(0.92); }
        #mining-btn.disabled { background: #1e2f4d; box-shadow: none; opacity: 0.4; filter: grayscale(1); pointer-events: none; }

        .ref-box {
            background: rgba(255,255,255,0.03); padding: 20px; border-radius: 24px;
            width: 100%; max-width: 350px; text-align: center;
            border: 1px solid rgba(255,255,255,0.06); margin-top: 20px;
        }
        #next-mine-timer { margin-top: 15px; font-size: 0.9rem; font-weight: 800; color: #8492a6; }
    </style>
</head>
<body>

    <div id="custom-toast"></div>

    <div id="reg-screen">
        <div class="trinex-logo">
            <div class="logo-diamond"></div>
            <div class="logo-x">T</div>
        </div>
        <h2 style="margin-bottom: 10px; font-weight: 900;">Identity Required</h2>
        <p style="color: #8492a6; margin-bottom: 30px; text-align: center;">Choose your pilot name to start<br>the TRINEX Mining Phase.</p>
        
        <input type="text" id="reg-name" class="input-box" placeholder="Your Username">
        <input type="text" id="reg-ref" class="input-box" placeholder="Referral Code (Optional)">
        
        <button id="reg-btn" onclick="registerUser()" class="btn-bounce" style="background: var(--trinex); color: white; width: 100%; max-width: 350px; padding: 20px; border-radius: 20px; border: none; font-weight: 900; margin-top: 10px; box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);">ACTIVATE PROTOCOL</button>
    </div>

    <div class="countdown-top">Mining Phase Ends: <span id="phase-timer">--d --h --m</span></div>
    
    <div class="trinex-logo">
        <div class="logo-diamond"></div>
        <div class="logo-x">T</div>
    </div>

    <div class="phase-header"><i class="fa-solid fa-microchip"></i> PHASE 1: MINING</div>

    <div class="balance-section">
        <div style="color: var(--trinex); font-size: 0.8rem; font-weight: 800; letter-spacing: 2px;">TOTAL ASSETS</div>
        <div class="balance-amount" id="trx-balance">0.00</div>
        <div style="font-weight: 900; font-size: 0.8rem; opacity: 0.6;">TRINEX TOKEN</div>
    </div>

    <div class="mining-container">
        <svg viewBox="0 0 280 280">
            <circle class="bg-circle" cx="140" cy="140" r="130"></circle>
            <circle id="progress-ring" class="progress-circle" cx="140" cy="140" r="130"></circle>
        </svg>
        <button id="mining-btn" class="btn-bounce" onmousedown="startHold()" onmouseup="stopHold()" ontouchstart="startHold()" ontouchend="stopHold()">
            <i class="fa-solid fa-bolt-lightning" style="font-size: 2.2rem; margin-bottom: 10px;"></i>
            <span id="btn-text" style="text-transform: uppercase;">Hold to Mine</span>
        </button>
    </div>

    <div id="next-mine-timer">Ready for Session</div>

    <div class="ref-box">
        <div style="font-size: 0.65rem; font-weight: 900; color: #64748b; letter-spacing: 1px; margin-bottom: 8px;">NETWORK ACCESS CODE</div>
        <div id="my-ref-code" onclick="copyRef()" style="font-size: 1.2rem; font-weight: 900; color: white; cursor: pointer; letter-spacing: 3px;">----</div>
        <div style="font-size: 0.6rem; color: var(--success); margin-top: 8px; font-weight: 800;">TAP TO COPY & EARN 20 TRX</div>
    </div>

    <script>
        const _supa = getClient();
        const myEmail = localStorage.getItem('user_email');
        let trinexData = null;
        let holdTimer, count = 60;
        const totalDash = 817;

        window.onload = async () => {
            if(!myEmail) { location.href = 'login.html'; return; }
            await loadTrinexProfile();
            startPhaseCountdown();
        };

        function showToast(msg, type = 'info') {
            const t = document.getElementById('custom-toast');
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check';
            const color = type === 'error' ? 'var(--danger)' : 'var(--success)';
            t.innerHTML = `<i class="fa-solid ${icon}" style="color:${color}"></i> <span>${msg}</span>`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadTrinexProfile() {
            // Using maybeSingle to prevent crash if record is missing
            const { data, error } = await _supa.from('trinex_airdrop').select('*').eq('user_email', myEmail).maybeSingle();
            if (error) {
                console.error(error);
                return showToast("System connection error", "error");
            }
            
            if (!data) {
                document.getElementById('reg-screen').style.display = 'flex';
            } else {
                trinexData = data;
                document.getElementById('trx-balance').innerText = parseFloat(data.balance).toLocaleString(undefined, {minimumFractionDigits: 2});
                document.getElementById('my-ref-code').innerText = data.referral_code;
                checkMiningAvailability();
            }
        }

        async function registerUser() {
            const name = document.getElementById('reg-name').value.trim();
            const refUsed = document.getElementById('reg-ref').value.trim();
            const btn = document.getElementById('reg-btn');
            
            if(!name) return showToast("Enter a name!", "error");

            btn.disabled = true;
            btn.innerText = "AUTHENTICATING...";

            // VALIDATE REFERRAL CODE
            if(refUsed !== "") {
                const { data: refCheck } = await _supa.from('trinex_airdrop').select('id').eq('referral_code', refUsed).maybeSingle();
                if(!refCheck) {
                    btn.disabled = false;
                    btn.innerText = "ACTIVATE PROTOCOL";
                    return showToast("Invalid referral code!", "error");
                }
            }

            const myCode = 'TRX-' + Math.floor(1000 + Math.random() * 9000);
            const { error } = await _supa.from('trinex_airdrop').insert([{
                user_email: myEmail, 
                username: name, 
                referral_code: myCode, 
                referred_by: refUsed || null,
                balance: 0
            }]);

            if(!error) {
                showToast("Protocol Activated!");
                setTimeout(() => location.reload(), 1500);
            } else {
                btn.disabled = false;
                btn.innerText = "ACTIVATE PROTOCOL";
                // 23505 is Supabase/Postgres code for unique constraint violation
                if(error.code === '23505') showToast("Name already taken!", "error");
                else showToast("Registration Error", "error");
            }
        }

        function setProgress(percent) {
            const ring = document.getElementById('progress-ring');
            const offset = totalDash - (percent / 60) * totalDash;
            ring.style.strokeDashoffset = offset;
        }

        function startHold() {
            if(document.getElementById('mining-btn').classList.contains('disabled')) return;
            holdTimer = setInterval(() => {
                if(count > 0) {
                    count--;
                    setProgress(60 - count);
                    document.getElementById('btn-text').innerText = count + 's';
                } else {
                    completeMining();
                }
            }, 1000);
        }

        function stopHold() {
            clearInterval(holdTimer);
            if(count > 0) {
                count = 60;
                setProgress(0);
                document.getElementById('btn-text').innerText = "Hold to Mine";
            }
        }

        async function completeMining() {
            clearInterval(holdTimer);
            const mBtn = document.getElementById('mining-btn');
            mBtn.classList.add('disabled'); // Prevent double triggers
            document.getElementById('btn-text').innerText = "SYNCING...";

            const reward = (Math.random() * (15 - 7) + 7).toFixed(2);
            const newBalance = parseFloat(trinexData.balance) + parseFloat(reward);
            
            const { error } = await _supa.from('trinex_airdrop').update({ 
                balance: newBalance, last_mined_at: new Date().toISOString()
            }).eq('user_email', myEmail);

            if(!error) {
                showToast(`SUCCESS: ${reward} TRX MINED`, "success");
                setTimeout(() => location.reload(), 2000);
            } else {
                mBtn.classList.remove('disabled');
                document.getElementById('btn-text').innerText = "Retry Sync";
                showToast("Mining sync failed!", "error");
            }
        }

        function checkMiningAvailability() {
            if(!trinexData.last_mined_at) return;
            const lastMine = new Date(trinexData.last_mined_at).getTime();
            const hours24 = 24 * 60 * 60 * 1000;
            if (Date.now() - lastMine < hours24) {
                const btn = document.getElementById('mining-btn');
                btn.classList.add('disabled');
                btn.innerHTML = '<i class="fa-solid fa-snowflake" style="font-size:2rem; margin-bottom:10px;"></i> <span>STABILIZING</span>';
                setInterval(() => {
                    const remaining = hours24 - (Date.now() - lastMine);
                    if(remaining <= 0) location.reload();
                    const h = Math.floor(remaining / 3600000);
                    const m = Math.floor((remaining % 3600000) / 60000);
                    const s = Math.floor((remaining % 60000) / 1000);
                    document.getElementById('next-mine-timer').innerText = `NEXT SESSION: ${h}h ${m}m ${s}s`;
                }, 1000);
            }
        }

        function startPhaseCountdown() {
            const end = new Date("May 11, 2026 00:00:00").getTime();
            setInterval(() => {
                const diff = end - Date.now();
                if(diff < 0) {
                    document.getElementById('phase-timer').innerText = "Phase Ended";
                    return;
                }
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('phase-timer').innerText = `${d}d ${h}h ${m}m`;
            }, 1000);
        }

        function copyRef() {
            navigator.clipboard.writeText(document.getElementById('my-ref-code').innerText);
            showToast("Access Code Copied!");
        }
    </script>
</body>
</html>
