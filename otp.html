<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify - Aviator Genius</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #007bff; 
            --bg-dark: #02050a; 
            --card-bg: rgba(13, 25, 48, 0.98);
            --success: #00ff88;
            --error: #ff3366;
        }

        /* --- ANTI-COPY & OPTIMIZATION --- */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        input { user-select: auto !important; -webkit-user-select: auto !important; }

        body { 
            background: var(--bg-dark);
            color: white; font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        /* --- MODERN AURA BACKGROUND --- */
        .aura {
            position: fixed; width: 400px; height: 400px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            filter: blur(80px); opacity: 0.15; z-index: -1;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .card { 
            background: var(--card-bg); 
            padding: 40px 25px; border-radius: 35px; 
            width: 90%; max-width: 380px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            text-align: center; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        h3 { font-size: 1.7rem; font-weight: 900; margin: 0; letter-spacing: 1px; color: #fff; }
        p { font-size: 0.85rem; color: #94a3b8; margin: 10px 0 30px; line-height: 1.5; }

        /* --- PUNCHY OTP INPUT --- */
        #otp-input { 
            width: 100%; padding: 22px; margin-bottom: 25px; 
            border-radius: 20px; border: 2px solid rgba(255, 255, 255, 0.1); 
            text-align: center; font-size: 2.5rem; letter-spacing: 12px; 
            font-weight: 900; background: #fff; color: #000; 
            outline: none; transition: 0.3s;
        }
        #otp-input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 123, 255, 0.4); }

        /* --- BOUNCY BUTTON --- */
        .verify-btn { 
            width: 100%; padding: 18px; 
            background: linear-gradient(135deg, var(--primary), #0056b3); 
            color: white; border: none; border-radius: 18px; 
            font-weight: 900; font-size: 1rem; text-transform: uppercase;
            cursor: pointer; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0, 123, 255, 0.3);
        }
        .verify-btn:active { transform: scale(0.92); }
        .verify-btn:disabled { opacity: 0.6; transform: none; }

        .status-msg { 
            margin-top: 20px; font-size: 0.75rem; 
            padding: 10px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: #94a3b8; font-weight: 700; letter-spacing: 0.5px;
        }

        .timer-box { margin-top: 25px; font-size: 0.85rem; font-weight: 600; }
        .resend-link { color: var(--primary); cursor: pointer; display: none; text-decoration: underline; }
        
        #toast { 
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%); 
            padding: 15px 25px; border-radius: 20px; z-index: 9999; 
            font-weight: 800; font-size: 0.85rem; color: white;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; gap: 10px;
        }
        #toast.show { top: 30px; }

        /* --- ERROR SHAKE --- */
        .shake { animation: shakeAnim 0.4s ease; }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="aura"></div>
    <div id="toast"></div>

    <div class="card" id="main-card">
        <h3>CHECK MAIL</h3>
        <p>A 6-digit verification code has been <br> sent to your inbox.</p>
        
        <input type="number" id="otp-input" placeholder="000000" 
               oninput="if(this.value.length > 6) this.value = this.value.slice(0, 6)">
        
        <button id="verify-btn" class="verify-btn" onclick="handleVerify()">
            Verify Account
        </button>
        
        <div class="status-msg">
            <i class="fa-solid fa-shield-halved"></i> SECURED VERIFICATION GATEWAY
        </div>

        <div class="timer-box">
            <span id="timer-text">Resend in <span id="timer" style="color: var(--primary)">03:00</span></span>
            <span id="resend-link" class="resend-link" onclick="requestNewCode()">Request New Code</span>
        </div>
    </div>

    <script>
        (function(){ emailjs.init("GeCipLr0kFPCN8feN"); })();

        var _supa;
        var myEmail = localStorage.getItem('user_email'); 
        var countdown;

        window.onload = function() {
            _supa = getClient();
            if (!myEmail) { location.href='register.html'; return; }
            startTimer(180);
        };

        function startTimer(seconds) {
            clearInterval(countdown);
            const display = document.querySelector('#timer');
            const timerText = document.querySelector('#timer-text');
            const resendLink = document.querySelector('#resend-link');
            
            resendLink.style.display = "none";
            timerText.style.display = "inline";

            let timer = seconds;
            countdown = setInterval(function () {
                let minutes = parseInt(timer / 60, 10);
                let secs = parseInt(timer % 60, 10);
                display.textContent = (minutes < 10 ? "0" : "") + minutes + ":" + (secs < 10 ? "0" : "") + secs;

                if (--timer < 0) {
                    clearInterval(countdown);
                    timerText.style.display = "none";
                    resendLink.style.display = "inline";
                }
            }, 1000);
        }

        function showToast(msg, isSuccess) {
            const t = document.getElementById('toast');
            t.innerHTML = isSuccess ? `<i class="fa-solid fa-circle-check"></i> ${msg}` : `<i class="fa-solid fa-circle-xmark"></i> ${msg}`;
            t.style.background = isSuccess ? "var(--success)" : "var(--error)";
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 3000);
        }

        async function requestNewCode() {
            const link = document.getElementById('resend-link');
            link.style.pointerEvents = "none";
            link.innerText = "SENDING...";

            const newOTP = Math.floor(100000 + Math.random() * 900000);

            try {
                await emailjs.send('service_huev2pt', 'template_r50pcwk', {
                    email: myEmail,
                    passcode: newOTP
                });
                localStorage.setItem('pending_otp', newOTP);
                showToast("New Code Dispatched!", true);
                startTimer(180);
                link.innerText = "Request New Code";
                link.style.pointerEvents = "auto";
            } catch (err) {
                showToast("Network Error", false);
                link.style.pointerEvents = "auto";
            }
        }

        async function handleVerify() {
            const input = document.getElementById('otp-input');
            const btn = document.getElementById('verify-btn');
            const card = document.getElementById('main-card');
            const correctOTP = localStorage.getItem('pending_otp');

            if (input.value.length < 6) return showToast("Enter full code", false);

            btn.innerText = "VERIFYING...";
            btn.disabled = true;

            if (input.value === String(correctOTP)) {
                try {
                    const { error } = await _supa
                        .from('profiles')
                        .update({ otp_status: 'VERIFIED' })
                        .eq('email', myEmail);

                    if (error) throw error;
                    showToast("Access Granted!", true);
                    setTimeout(() => { location.href='login.html'; }, 2000);
                } catch (err) {
                    showToast("Sync Error", false);
                    btn.innerText = "Verify Account";
                    btn.disabled = false;
                }
            } else {
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
                showToast("Invalid Code", false);
                btn.innerText = "Verify Account";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
