<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Genius - Signal Incoming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #007bff; 
            --neon-blue: #00f2ff;
            --bg-dark: #02050a; 
            --bg-accent: #0a192f;
            --success: #10b981;
            --warning: #facc15;
        }

        /* PERFORMANCE OPTIMIZED RESET */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
            outline: none;
        }

        body { 
            background: var(--bg-dark);
            color: white; font-family: 'Inter', system-ui, sans-serif; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        /* LIGHTER BACKGROUND ENGINE (Fixes Lag) */
        .bg-layer {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, var(--bg-accent) 0%, var(--bg-dark) 100%);
            z-index: -2;
        }

        .grid-overlay {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            z-index: -1;
            animation: gridScroll 20s linear infinite;
            will-change: transform;
        }

        @keyframes gridScroll {
            from { background-position: 0 0; }
            to { background-position: 0 40px; }
        }

        .content-box { 
            text-align: center; z-index: 10; width: 90%; max-width: 400px;
            animation: fadeIn 0.8s ease-out;
        }

        /* --- RADAR SYSTEM (GPU Optimized) --- */
        .radar-container {
            position: relative; width: 140px; height: 140px; margin: 0 auto 20px;
            display: flex; justify-content: center; align-items: center;
        }

        .radar-sweep {
            position: absolute; inset: -10px;
            background: conic-gradient(from 0deg, transparent 60%, rgba(0, 242, 255, 0.4) 100%);
            border-radius: 50%; animation: sweep 2.5s linear infinite;
            will-change: transform;
        }

        .bonus-icon {
            font-size: 3rem; color: #fff;
            filter: drop-shadow(0 0 15px var(--neon-blue));
            z-index: 5; animation: hoverIcon 3s ease-in-out infinite;
        }

        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes hoverIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* --- WRITE UP SECTION --- */
        .system-brief {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; padding: 20px; margin: 25px 0;
            backdrop-filter: blur(10px);
        }

        .brief-title {
            color: var(--warning); font-size: 0.7rem; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
        }

        .brief-text {
            font-size: 0.85rem; line-height: 1.5; color: #94a3b8; font-weight: 500;
        }

        .highlight-white { color: #fff; font-weight: 700; }

        /* --- TYPOGRAPHY --- */
        .main-header {
            font-size: 2rem; font-weight: 900; letter-spacing: 3px; margin: 0;
            background: linear-gradient(to bottom, #fff, var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .status-pill {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 15px; padding: 8px 20px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 50px; font-size: 0.6rem; font-weight: 800;
            letter-spacing: 1.5px; color: var(--neon-blue);
        }

        .dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        /* --- RECOMMENDATION: GLOWING BUTTON --- */
        .btn-sync {
            width: 100%; padding: 18px; margin-top: 10px;
            background: var(--primary); color: white; text-decoration: none;
            border-radius: 15px; font-weight: 900; font-size: 0.85rem;
            display: block; letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.2);
            transition: 0.3s;
        }
        .btn-sync:active { transform: scale(0.96); background: #0056b3; }

        .back-link {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.3); text-decoration: none; font-size: 0.7rem;
            font-weight: 800;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="bg-layer"></div>
    <div class="grid-overlay"></div>

    <div class="content-box">
        <div class="radar-container">
            <div class="radar-sweep"></div>
            <i class="fa-solid fa-satellite-dish bonus-icon"></i>
        </div>

        <h1 class="main-header">SIGNAL DETECTED</h1>
        
        <div class="status-pill">
            <div class="dot"></div>
            WAVE 02 INITIATING
        </div>

        <div class="system-brief">
            <div class="brief-title"><i class="fa-solid fa-circle-info"></i> System Update</div>
            <p class="brief-text">
                The <span class="highlight-white">Elite Genesis</span> bonus phase has officially concluded. 
                Our servers are currently calibrating the <span class="highlight-white">Next-Gen Signal Wave</span>. 
                Your account is being scanned for priority access.
            </p>
        </div>

        <a href="home.html" class="btn-sync">CHECK ELIGIBILITY</a>
    </div>

    <a href="home.html" class="back-link">
        <i class="fa-solid fa-chevron-left"></i> RETURN TO HOME
    </a>

    <script>
        // Disable selection and context menu
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c')) e.preventDefault();
        });
    </script>

</body>
</html>
