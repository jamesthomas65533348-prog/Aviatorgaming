<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Genius - Upcoming Event</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #007bff; 
            --neon-blue: #00f2ff;
            --bg-dark: #02050a; 
            --bg-accent: #0a192f;
            --card-bg: rgba(10, 20, 35, 0.9);
        }

        body { 
            background: radial-gradient(circle at center, var(--bg-accent) 0%, var(--bg-dark) 100%);
            color: white; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            perspective: 1200px;
        }

        /* --- MATCHING 3D BACKGROUND GRID --- */
        body::before {
            content: ""; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: linear-gradient(rgba(0, 123, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 123, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px; transform: rotateX(65deg); z-index: -1;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { transform: rotateX(65deg) translateY(0); } 100% { transform: rotateX(65deg) translateY(60px); } }

        .content-box {
            text-align: center;
            z-index: 10;
            padding: 30px;
        }

        /* --- THE STICKER DESIGN --- */
        .sticker-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sticker-base {
            font-size: 5rem;
            color: var(--neon-blue);
            filter: drop-shadow(0 0 15px var(--primary));
            animation: rotateSticker 10s linear infinite;
        }

        .sticker-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--primary);
            border-radius: 50%;
            animation: pulseSticker 2s ease-out infinite;
            opacity: 0;
        }

        @keyframes rotateSticker {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseSticker {
            0% { transform: scale(0.6); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* --- TYPOGRAPHY --- */
        .big-writeup {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
            line-height: 1.1;
            background: linear-gradient(to bottom, #fff 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
        }

        .status-tag {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--neon-blue);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--neon-blue);
        }

        /* --- NAVIGATION --- */
        .back-home {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .back-home:hover { color: var(--primary); }

    </style>
</head>
<body>

    <div class="content-box">
        <div class="sticker-container">
            <div class="sticker-pulse"></div>
            <div class="sticker-pulse" style="animation-delay: 0.5s"></div>
            <i class="fa-solid fa-compass-drafting sticker-base"></i>
        </div>

        <h1 class="big-writeup">NEXT EVENT<br>COMING SOON</h1>
        
        <div class="status-tag">SIGNAL DETECTED</div>
    </div>

    <a href="home.html" class="back-home">
        <i class="fa-solid fa-chevron-left"></i> RETURN TO COCKPIT
    </a>

</body>
</html>
