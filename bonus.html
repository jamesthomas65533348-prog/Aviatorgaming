<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Event Closed</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
    --accent:#ff003c;
    --bg:#050505;
    --glass:rgba(255,255,255,0.03);
    --border:rgba(255,255,255,0.08);
    --neon:#00f2ff;
    --gold:#fbbf24;
    --spring:cubic-bezier(0.34,1.56,0.64,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:var(--bg);
    color:white;
    width:100%;
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* =========================
   BACKGROUND EFFECTS
========================= */

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;

    background:
    radial-gradient(circle,
    rgba(255,0,60,0.18),
    transparent 70%);

    top:-180px;
    right:-120px;

    filter:blur(20px);

    animation:floatGlow 8s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;

    background:
    radial-gradient(circle,
    rgba(0,242,255,0.08),
    transparent 70%);

    bottom:-160px;
    left:-120px;

    filter:blur(30px);

    animation:floatGlow2 10s ease-in-out infinite alternate;
}

@keyframes floatGlow{

    0%{
        transform:translateY(0px);
    }

    100%{
        transform:translateY(30px);
    }
}

@keyframes floatGlow2{

    0%{
        transform:translateX(0px);
    }

    100%{
        transform:translateX(25px);
    }
}

/* =========================
   GRID
========================= */

.grid{
    position:absolute;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

    background-size:35px 35px;

    mask-image:linear-gradient(to bottom, transparent, black);
}

/* =========================
   MAIN CARD
========================= */

.card{

    width:90%;
    max-width:380px;

    background:rgba(10,10,10,0.82);

    border:1px solid var(--border);

    backdrop-filter:blur(18px);

    border-radius:35px;

    padding:40px 28px;

    text-align:center;

    position:relative;

    overflow:hidden;

    box-shadow:
    0 0 50px rgba(255,0,60,0.12),
    inset 0 0 25px rgba(255,255,255,0.02);

    animation:cardEnter 0.8s var(--spring);
}

@keyframes cardEnter{

    from{
        opacity:0;
        transform:translateY(30px) scale(0.95);
    }

    to{
        opacity:1;
        transform:translateY(0px) scale(1);
    }
}

/* =========================
   BORDER GLOW
========================= */

.card::before{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:35px;

    padding:1px;

    background:
    linear-gradient(
        135deg,
        rgba(255,0,60,0.7),
        rgba(0,242,255,0.2)
    );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;
}

/* =========================
   ICON
========================= */

.icon-wrap{

    width:110px;
    height:110px;

    margin:auto;

    margin-bottom:28px;

    border-radius:35px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        135deg,
        rgba(255,0,60,0.08),
        rgba(255,255,255,0.02)
    );

    border:1px solid rgba(255,0,60,0.25);

    position:relative;

    animation:pulseBox 3s infinite;
}

.icon-wrap::before{

    content:"";

    position:absolute;

    inset:-8px;

    border-radius:40px;

    border:1px solid rgba(255,0,60,0.08);

    animation:ring 3s infinite;
}

@keyframes ring{

    0%{
        transform:scale(1);
        opacity:0.7;
    }

    100%{
        transform:scale(1.18);
        opacity:0;
    }
}

@keyframes pulseBox{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }
}

.icon-wrap i{

    font-size:3.2rem;

    color:var(--accent);

    text-shadow:
    0 0 20px rgba(255,0,60,0.5);
}

/* =========================
   TEXTS
========================= */

.title{

    font-size:1.7rem;

    font-weight:900;

    letter-spacing:-1px;

    line-height:1.2;

    margin-bottom:18px;
}

.message{

    color:#999;

    font-size:0.92rem;

    line-height:1.8;

    margin-bottom:28px;
}

/* =========================
   STATUS BOX
========================= */

.status{

    background:var(--glass);

    border:1px solid var(--border);

    border-radius:22px;

    padding:18px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    backdrop-filter:blur(12px);
}

.status-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:var(--gold);

    box-shadow:
    0 0 15px var(--gold);

    animation:blink 1.5s infinite;
}

@keyframes blink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:0.3;
    }
}

.status span{

    font-size:0.78rem;

    color:#bbb;

    font-weight:700;

    letter-spacing:0.5px;
}

/* =========================
   FOOTER LABEL
========================= */

.footer-label{

    margin-top:22px;

    font-size:0.65rem;

    color:#555;

    letter-spacing:2px;
}

</style>
</head>

<body>

<div class="grid"></div>

<div class="card">

    <div class="icon-wrap">

        <i class="fa-solid fa-hourglass-end"></i>

    </div>

    <div class="title">
        THIS EVENT<br>HAS ENDED
    </div>

    <div class="message">

        The partnership reward campaign has officially concluded.<br><br>

        Our development team is currently reviewing all event operations,
        processing submissions, and preparing the next deployment phase.

    </div>

    <div class="status">

        <div class="status-dot"></div>

        <span>
            EVENT DATA CURRENTLY UNDER REVIEW
        </span>

    </div>

    <div class="footer-label">
        AVIATOR GENIUS EVENT TERMINAL
    </div>

</div>

</body>
</html>
