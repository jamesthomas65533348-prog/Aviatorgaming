<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Partnership Event - Aviator Genius x SportyBet</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root{
            --accent:#ff003c;
            --sporty:#ed1c24;
            --bg:#050505;
            --glass:rgba(255,255,255,0.03);
            --border:rgba(255,255,255,0.08);
            --gold:#fbbf24;
            --error:#ff2d55;
            --spring:cubic-bezier(0.34,1.56,0.64,1);
        }

        *{
            -webkit-tap-highlight-color:transparent;
            user-select:none;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background:var(--bg);
            color:white;
            margin:0;
            min-height:100vh;
            overflow-x:hidden;
            position:relative;
        }

        body::before,
        body::after{
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;
            z-index:-1;
        }

        body::before{

            background-image:
                url('sporty.png'),
                url('aviator.png'),
                url('sporty.png'),
                url('aviator.png');

            background-repeat:no-repeat;

            background-size:
                140px,
                180px,
                130px,
                160px;

            background-position:
                8% 15%,
                90% 25%,
                15% 85%,
                85% 75%;

            opacity:0.06;

            animation:floatWater 18s ease-in-out infinite alternate;
        }

        body::after{
            background:
                radial-gradient(circle at top right,
                rgba(237,28,36,0.15),
                transparent 40%),

                radial-gradient(circle at bottom left,
                rgba(255,255,255,0.03),
                transparent 35%);
        }

        @keyframes floatWater{

            0%{
                transform:translateY(0px) translateX(0px);
            }

            50%{
                transform:translateY(-15px) translateX(8px);
            }

            100%{
                transform:translateY(15px) translateX(-8px);
            }
        }

        /* =========================
           SESSION MODAL
        ========================= */

        .modal-overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.9);
            backdrop-filter:blur(10px);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:6000;
            padding:20px;
        }

        .modal-card{
            background:#111;
            padding:35px;
            border-radius:35px;
            border:1px solid var(--border);
            width:100%;
            max-width:350px;
            text-align:center;
        }

        /* =========================
           SPLASH
        ========================= */

        #splash{
            position:fixed;
            inset:0;
            background:rgba(5,5,5,0.96);
            backdrop-filter:blur(12px);
            z-index:1000;

            display:none;
            flex-direction:column;
            align-items:center;
            justify-content:center;

            text-align:center;
            padding:30px;
        }

        .splash-logo{
            width:90px;
            height:90px;
            object-fit:contain;
            animation:pulse 2s infinite;
            filter:drop-shadow(0 0 20px rgba(237,28,36,0.4));
        }

        .splash-title{
            font-size:2rem;
            font-weight:900;
            letter-spacing:-1px;
            margin-top:10px;
        }

        .splash-sub{
            color:#888;
            margin:15px 0 30px;
            font-size:0.9rem;
            line-height:1.6;
            max-width:320px;
        }

        /* =========================
           MAIN
        ========================= */

        .header{
            padding:25px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            border-bottom:1px solid var(--border);
            backdrop-filter:blur(10px);
            background:rgba(255,255,255,0.01);
        }

        .header-left{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .admin-btn{
            display:none;
            align-items:center;
            gap:8px;
            background:rgba(251,191,36,0.08);
            border:1px solid rgba(251,191,36,0.35);
            color:var(--gold);
            padding:10px 14px;
            border-radius:50px;
            font-size:0.7rem;
            font-weight:900;
            letter-spacing:1px;
        }

        .content{
            padding:20px;
        }

        .partner-card{

            background:linear-gradient(
                135deg,
                rgba(237,28,36,0.15),
                rgba(255,255,255,0.02)
            );

            border:1px solid rgba(237,28,36,0.2);

            border-radius:25px;

            padding:20px;
            margin-bottom:25px;

            display:flex;
            align-items:center;
            justify-content:space-around;

            backdrop-filter:blur(15px);
        }

        .input-group{
            background:var(--glass);
            border:1px solid var(--border);
            border-radius:20px;
            padding:15px;
            margin-bottom:15px;
            backdrop-filter:blur(10px);
        }

        .input-group label{
            display:block;
            font-size:0.6rem;
            color:#777;
            font-weight:800;
            text-transform:uppercase;
            margin-bottom:8px;
            letter-spacing:1px;
        }

        .input-group input{
            background:transparent;
            border:none;
            color:white;
            width:100%;
            font-size:1.1rem;
            font-weight:700;
            outline:none;
        }

        .claim-btn{
            width:100%;
            padding:20px;
            border-radius:20px;
            border:none;
            background:var(--sporty);
            color:white;
            font-weight:900;
            text-transform:uppercase;
            letter-spacing:1px;
            margin-top:10px;
            cursor:pointer;

            box-shadow:
                0 10px 20px rgba(237,28,36,0.25),
                0 0 20px rgba(237,28,36,0.15);

            transition:0.3s;
        }

        .claim-btn:active{
            transform:scale(0.98);
        }

        #popup-overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.82);
            backdrop-filter:blur(10px);
            z-index:2000;
            display:none;
            align-items:center;
            justify-content:center;
        }

        .pop-card{
            background:#0a0a0a;
            border:1px solid var(--border);
            border-radius:35px;

            width:85%;
            max-width:350px;

            padding:40px 25px;

            text-align:center;

            animation:popUp 0.5s var(--spring);
        }

        @keyframes popUp{

            from{
                transform:scale(0.8);
                opacity:0;
            }

            to{
                transform:scale(1);
                opacity:1;
            }
        }

        .pop-icon{
            font-size:3rem;
            margin-bottom:20px;
        }

        .pop-btn{
            margin-top:25px;
            width:100%;
            padding:15px;
            border-radius:15px;
            border:none;
            font-weight:800;
            cursor:pointer;
        }

        @keyframes pulse{

            0%{
                transform:scale(1);
                opacity:1;
            }

            50%{
                transform:scale(1.05);
                opacity:0.8;
            }

            100%{
                transform:scale(1);
                opacity:1;
            }
        }

    </style>
</head>

<body oncontextmenu="return false;">

    <!-- SESSION MODAL -->

    <div class="modal-overlay" id="sessionModal">

        <div class="modal-card">

            <i class="fa-solid fa-shield-virus"
               style="font-size:3rem; color:var(--error); margin-bottom:15px;">
            </i>

            <h3>Session Clash</h3>

            <p style="opacity:0.6; font-size:0.9rem;">
                Another device logged into this account.
            </p>

            <button
                style="
                    width:100%;
                    padding:18px;
                    border:none;
                    border-radius:18px;
                    background:var(--accent);
                    color:white;
                    font-weight:900;
                    margin-top:20px;
                "
                onclick="forceLogout()">

                Re-Authenticate

            </button>

        </div>

    </div>

    <!-- SPLASH -->

    <div id="splash">

        <div style="display:flex; align-items:center; gap:15px; margin-bottom:25px;">

            <img src="aviator.png" class="splash-logo">

            <i class="fa-solid fa-xmark"
               style="color:var(--sporty); font-size:22px;">
            </i>

            <img src="sporty.png" class="splash-logo">

        </div>

        <h1 class="splash-title">
            PARTNERSHIP<br>BONUS EVENT
        </h1>

        <p class="splash-sub">
            Aviator Genius has teamed up with SportyBet.
            Claim your limited-time operational subsidy now.
        </p>

        <button class="claim-btn" onclick="closeSplash()">
            Proceed to Hangar
        </button>

    </div>

    <!-- POPUP -->

    <div id="popup-overlay">
        <div class="pop-card" id="pop-content"></div>
    </div>

    <!-- HEADER -->

    <div class="header">

        <div class="header-left">

            <i class="fa-solid fa-arrow-left"
               onclick="location.href='home.html'">
            </i>

            <span style="font-weight:900; letter-spacing:1px;">
                EVENT TERMINAL
            </span>

        </div>

        <!-- ADMIN ICON -->

        <div
            id="admin-btn"
            class="admin-btn"
            onclick="goAdmin()">

            <i class="fa-solid fa-shield-halved"></i>
            ADMIN

        </div>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <div class="partner-card">

            <span style="font-weight:900; font-size:0.8rem;">
                AVIATOR GENIUS
            </span>

            <i class="fa-solid fa-xmark"
               style="color: var(--sporty)">
            </i>

            <span style="font-weight:900; font-size:0.8rem; color:var(--sporty)">
                SPORTYBET
            </span>

        </div>

        <div class="input-group">

            <label>SportyBet Phone Number</label>

            <input
                type="tel"
                id="s-phone"
                placeholder="+234 707 2728 378"
                inputmode="numeric"
                maxlength="18"
                autocomplete="off"
            >

        </div>

        <div class="input-group">

            <label>Request Amount (Max 7,500 NGN)</label>

            <input
                type="number"
                id="s-amount"
                placeholder="Enter amount (1,000 - 7,500)"
            >

        </div>

        <p style="
            font-size:0.7rem;
            color:#666;
            text-align:center;
            margin-bottom:20px;
            line-height:1.5;
        ">
            * Rewards are processed within 24 hours after approval.
        </p>

        <button
            class="claim-btn"
            id="main-claim-btn"
            onclick="processClaim()">

            Claim Reward

        </button>

    </div>

    <script>

        var _supa;

        const uid = localStorage.getItem('user_id');

        const userEmail =
            localStorage.getItem('user_email');

        // =========================
        // LOAD
        // =========================

        window.onload = async function(){

            if(!userEmail){

                location.href = 'login.html';
                return;
            }

            _supa = getClient();

            setupPhoneFormatter();

            await validateSession();

            await loadAdminState();

            await checkSplash();

            await checkExistingClaim();

            // CONTINUOUS SESSION CHECK

            setInterval(validateSession, 5000);
        };

        // =========================
        // SESSION CHECK
        // =========================

        async function validateSession(){

            const localSession =
                localStorage.getItem('my_session_id');

            const { data } = await _supa
                .from('profiles')
                .select('current_session_id')
                .eq('email', userEmail)
                .single();

            if(
                data &&
                data.current_session_id &&
                data.current_session_id !== localSession
            ){

                document.getElementById(
                    'sessionModal'
                ).style.display = 'flex';
            }
        }

        function forceLogout(){

            localStorage.clear();

            location.href = 'login.html';
        }

        // =========================
        // ADMIN ICON
        // =========================

        async function loadAdminState(){

            const { data } = await _supa
                .from('profiles')
                .select('role')
                .eq('id', uid)
                .single();

            if(data && data.role === 'ADMIN'){

                document.getElementById(
                    'admin-btn'
                ).style.display = 'flex';

                localStorage.setItem(
                    'user_role',
                    'ADMIN'
                );
            }
        }

        function goAdmin(){

            if(
                localStorage.getItem('user_role')
                === 'ADMIN'
            ){

                location.href = 'admin.html';
            }
        }

        // =========================
        // PHONE FORMATTER
        // =========================

        function setupPhoneFormatter(){

            const phoneInput =
                document.getElementById('s-phone');

            phoneInput.addEventListener('input', function(e){

                let value =
                    e.target.value.replace(/\D/g, '');

                value = value.substring(0,11);

                if(value.length > 0 && value[0] !== '0'){

                    value = '0' + value;
                }

                if(value.length === 11){

                    let n = value.substring(1);

                    e.target.value =
                        '+234 ' +
                        n.substring(0,3) + ' ' +
                        n.substring(3,7) + ' ' +
                        n.substring(7,10);

                } else {

                    e.target.value = value;
                }
            });
        }

        // =========================
        // SPLASH
        // =========================

        async function checkSplash(){

            const { data } = await _supa
                .from('profiles')
                .select('seen_bonus_intro')
                .eq('id', uid)
                .single();

            if(data && !data.seen_bonus_intro){

                document.getElementById(
                    'splash'
                ).style.display = 'flex';
            }
        }

        async function closeSplash(){

            await _supa
                .from('profiles')
                .update({
                    seen_bonus_intro:true
                })
                .eq('id', uid);

            document.getElementById(
                'splash'
            ).style.display = 'none';
        }

        // =========================
        // CLAIM STATUS
        // =========================

        async function checkExistingClaim(){

            const btn =
                document.getElementById(
                    'main-claim-btn'
                );

            const { data } = await _supa
                .from('event_claims')
                .select('*')
                .eq('user_id', uid)
                .maybeSingle();

            if(data){

                if(data.status === 'PENDING'){

                    btn.innerHTML = `
                        <i class="fa-solid fa-clock"></i>
                        Request Pending
                    `;

                    btn.disabled = true;

                    btn.style.opacity = "0.65";

                    btn.style.background = "#555";
                }

                else if(data.status === 'APPROVED'){

                    btn.innerHTML = `
                        <i class="fa-solid fa-circle-check"></i>
                        Reward Approved
                    `;

                    btn.disabled = true;

                    btn.style.opacity = "0.8";

                    btn.style.background = "#00b36b";
                }

                else{

                    btn.innerHTML = `
                        <i class="fa-solid fa-gift"></i>
                        Reward Claimed & Disbursed
                    `;

                    btn.disabled = true;

                    btn.style.opacity = "0.9";

                    btn.style.background =
                        "linear-gradient(135deg,#00b36b,#00ffa3)";
                }
            }
        }

        // =========================
        // CLAIM PROCESS
        // =========================

        async function processClaim(){

            await validateSession();

            const phone =
                document.getElementById(
                    's-phone'
                ).value;

            const requested =
                document.getElementById(
                    's-amount'
                ).value;

            const cleanPhone =
                phone.replace(/\s/g,'');

            if(
                !cleanPhone.startsWith('+234') ||
                cleanPhone.length !== 14
            ){

                return showPop(
                    "error",
                    "Enter a valid Nigerian phone number."
                );
            }

            if(requested < 1000 || requested > 7500){

                return showPop(
                    "error",
                    "Request must be between 1,000 and 7,500."
                );
            }

            const { data: existing } = await _supa
                .from('event_claims')
                .select('status')
                .eq('user_id', uid)
                .maybeSingle();

            if(existing){

                if(existing.status === 'PENDING'){

                    return showPop(
                        "error",
                        "You already submitted a request. Please wait for approval."
                    );
                }

                if(existing.status === 'APPROVED'){

                    return showPop(
                        "error",
                        "This account has already received the partnership reward."
                    );
                }

                return showPop(
                    "error",
                    "Reward already claimed and disbursed."
                );
            }

            const { data: profile } = await _supa
                .from('profiles')
                .select('balance')
                .eq('id', uid)
                .single();

            if(profile.balance < 1000){

                showPop(
                    "low-funds",
                    "Your main balance must be funded with at least 1,000 NGN to qualify for this partnership event."
                );

                return;
            }

            let won = 0;

            const luck = Math.random() * 100;

            if(luck <= 2){

                won = 1000;

            } else {

                won = Math.floor(
                    Math.random() * (500 - 20 + 1)
                ) + 20;
            }

            const { error } = await _supa
                .from('event_claims')
                .insert({

                    user_id: uid,

                    email:
                        localStorage.getItem('user_email'),

                    sporty_phone: cleanPhone,

                    selected_amount: requested,

                    actual_won: won,

                    status: 'PENDING'
                });

            if(!error){

                const btn =
                    document.getElementById(
                        'main-claim-btn'
                    );

                btn.innerHTML = `
                    <i class="fa-solid fa-clock"></i>
                    Request Pending
                `;

                btn.disabled = true;

                btn.style.background = "#555";

                showPop(
                    "success",
                    "Your request has been submitted successfully and is awaiting approval."
                );

            } else {

                showPop(
                    "error",
                    "System busy. Try again later."
                );
            }
        }

        // =========================
        // POPUP
        // =========================

        function showPop(type, msg){

            const overlay =
                document.getElementById(
                    'popup-overlay'
                );

            const content =
                document.getElementById(
                    'pop-content'
                );

            overlay.style.display = 'flex';

            if(type === "low-funds"){

                content.innerHTML = `

                    <i class="fa-solid fa-triangle-exclamation pop-icon"
                       style="color: var(--accent)">
                    </i>

                    <h2 style="margin-bottom:10px">
                        Incomplete Fuel
                    </h2>

                    <p style="color:#888; font-size:0.9rem;">
                        ${msg}
                    </p>

                    <button
                        class="pop-btn"
                        style="background:var(--accent); color:white"
                        onclick="location.href='deposit.html'">

                        Go to Deposit

                    </button>
                `;
            }

            else if(type === "success"){

                content.innerHTML = `

                    <i class="fa-solid fa-circle-check pop-icon"
                       style="color:#00ffa3">
                    </i>

                    <h2 style="margin-bottom:10px">
                        Request Submitted
                    </h2>

                    <p style="color:#888; font-size:0.9rem;">
                        ${msg}
                    </p>

                    <button
                        class="pop-btn"
                        style="background:#00ffa3; color:black"
                        onclick="document.getElementById('popup-overlay').style.display='none'">

                        Okay

                    </button>
                `;
            }

            else{

                content.innerHTML = `

                    <i class="fa-solid fa-circle-xmark pop-icon"
                       style="color: var(--accent)">
                    </i>

                    <h2 style="margin-bottom:10px">
                        Access Denied
                    </h2>

                    <p style="color:#888; font-size:0.9rem;">
                        ${msg}
                    </p>

                    <button
                        class="pop-btn"
                        style="background:#222; color:white"
                        onclick="document.getElementById('popup-overlay').style.display='none'">

                        Try Again

                    </button>
                `;
            }
        }

    </script>

</body>
</html>
