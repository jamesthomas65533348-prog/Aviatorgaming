<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shield Command - Admin Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #3b82f6; 
            --bg: #020617; 
            --card: rgba(15, 23, 42, 0.8); 
            --success: #10b981; 
            --error: #ef4444; 
            --warning: #f59e0b; 
            --glass: rgba(255, 255, 255, 0.03);
        }

        body { 
            background: radial-gradient(circle at bottom left, #0f172a 0%, #020617 100%);
            color: white; font-family: 'Inter', system-ui, sans-serif; 
            padding: 0; margin: 0; min-height: 100vh;
        }

        /* --- TOP HUD --- */
        .admin-header {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(20px);
            padding: 15px 20px; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; gap: 12px;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .shield-logo { font-weight: 900; letter-spacing: 2px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card {
            background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 4px;
        }
        .stat-label { font-size: 0.55rem; font-weight: 800; color: #64748b; text-transform: uppercase; }
        .stat-value { font-family: 'Courier New', monospace; font-size: 0.9rem; font-weight: 900; color: var(--primary); }
        .stat-value.green { color: var(--success); }

        .live-indicator { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

        /* --- CONTENT --- */
        .content-area { padding: 20px 15px 100px; }
        .section-title { font-size: 0.7rem; font-weight: 900; color: var(--primary); letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
        .item-card { 
            background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; 
            border: 1px solid rgba(255,255,255,0.05); position: relative;
        }

        .amount-display { font-size: 1.4rem; font-weight: 900; margin: 15px 0; color: #fff; }
        .otp-box { 
            background: #000; border: 1px solid #333; color: white; padding: 14px; 
            border-radius: 12px; font-size: 1rem; width: 100%; box-sizing: border-box;
            font-family: 'Courier New', monospace; letter-spacing: 2px;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; border: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 0.75rem; cursor: pointer; color: white; text-transform: uppercase; transition: 0.2s; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--error); }
        .btn-action { background: var(--primary); }
        .btn:active { transform: scale(0.95); }

        /* --- BROADCAST MODAL --- */
        #broadcast-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; align-items: center; justify-content: center; z-index: 11000; padding: 20px;
            backdrop-filter: blur(10px);
        }
        .broadcast-box { background: #0f172a; border: 1px solid var(--primary); padding: 25px; border-radius: 24px; width: 100%; max-width: 450px; }
        .broadcast-textarea { width: 100%; height: 120px; background: #000; color: white; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; box-sizing: border-box; resize: none; margin-top: 15px; }

        /* --- BOUNCY FAB --- */
        .fab-notif {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--primary); color: white; border: none; border-radius: 50%;
            font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5); z-index: 1000;
        }
        .fab-notif:active { animation: bounceClick 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes bounceClick {
            0% { transform: scale(1); }
            30% { transform: scale(0.8); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #toast-wrap { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 12000; }
        .toast { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 10px; transform: translateY(-100px); transition: 0.4s; display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateY(0); }
        .toast.error { border-left: 4px solid var(--error); }
    </style>
</head>
<body>

    <div id="toast-wrap"></div>

    <div id="broadcast-modal">
        <div class="broadcast-box">
            <h3 style="margin:0;">DEPLOY BROADCAST</h3>
            <textarea id="broadcast-msg" class="broadcast-textarea" placeholder="Message to all pilots..."></textarea>
            
            <div style="margin-top:20px; display:flex; gap:10px; align-items:center;">
                <label style="flex:1; background:var(--glass); border:1px solid #1e293b; padding:12px; border-radius:12px; cursor:pointer; text-align:center; display:flex; align-items:center; justify-content:center; gap:10px;">
                    <i class="fa-solid fa-camera" style="color:var(--primary);"></i>
                    <span id="file-status" style="font-size:0.7rem; font-weight:800; color:#64748b;">ADD IMAGE</span>
                    <input type="file" id="broadcast-file" hidden accept="image/*" onchange="updateFileLabel(this)">
                </label>
            </div>

            <div class="btn-row">
                <button onclick="sendBroadcast()" id="send-btn" class="btn btn-success">SEND ALL</button>
                <button onclick="closeBroadcastModal()" class="btn" style="background: #1e293b;">CANCEL</button>
            </div>
        </div>
    </div>

    <div class="admin-header">
        <div class="header-top">
            <div class="shield-logo"><i class="fa-solid fa-user-shield" style="color: var(--primary);"></i> COMMAND SHIELD</div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="live-indicator"></div>
                <span style="font-size: 0.6rem; font-weight: 800; color: #64748b;">REWARDS LIVE</span>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Verified Pilots</span>
                <span class="stat-value" id="approved-count">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Total Distributed</span>
                <span class="stat-value green" id="total-payout">₦0</span>
            </div>
        </div>
    </div>

    <div class="content-area">
        <div class="section-title">Active Reward Claims</div>
        <div id="main-content"></div>
    </div>

    <button class="fab-notif" onclick="openBroadcastModal()"><i class="fa-solid fa-bullhorn"></i></button>

    <script>
        var _supa;

        window.onload = function() {
            if (!isAdmin()) { location.href = 'home.html'; return; }
            _supa = getClient();
            loadBonusClaims();
            updateStats();
            setInterval(() => { loadBonusClaims(true); updateStats(); }, 5000);
        };

        async function updateStats() {
            try {
                const { count } = await _supa.from('profiles').select('*', { count: 'exact', head: true }).neq('otp_status', 'PENDING');
                document.getElementById('approved-count').innerText = count || 0;

                const { data } = await _supa.from('bonus_claims').select('won_amount').eq('reward_status', 'COMPLETED');
                if(data) {
                    const total = data.reduce((s, i) => s + (parseFloat(i.won_amount) || 0), 0);
                    document.getElementById('total-payout').innerText = '₦' + total.toLocaleString();
                }
            } catch (e) { console.error(e); }
        }

        async function loadBonusClaims(silent = false) {
            const area = document.getElementById('main-content');
            if(!silent) area.innerHTML = '<p style="text-align:center; opacity:0.3; margin-top:50px;">Syncing Rewards...</p>';

            try {
                // Modified to exclude REJECTED status so they disappear from the list
                const { data } = await _supa.from('bonus_claims')
                    .select('*')
                    .neq('reward_status', 'COMPLETED')
                    .neq('payment_statuz', 'REJECTED')
                    .order('created_at', {ascending: false});
                
                if(!data || data.length === 0) {
                    area.innerHTML = '<p style="text-align:center; opacity:0.3; margin-top:50px;">NO ACTIVE CLAIMS</p>';
                    return;
                }

                area.innerHTML = data.map(b => {
                    const timeStr = new Date(b.created_at).toLocaleString('en-NG', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
                    
                    return `
                    <div class="item-card">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <div style="font-size:0.7rem; font-weight:800; color:var(--primary);">${b.user_email}</div>
                            <div style="font-size:0.55rem; color:#64748b; font-weight:700;">${timeStr}</div>
                        </div>
                        <div style="font-size:0.6rem; opacity:0.6; margin-top:5px;">STATUS: ${b.payment_statuz}</div>
                        
                        ${b.payment_statuz === 'PENDING' ? `
                            <div class="btn-row">
                                <button class="btn btn-success" onclick="approveBonus('${b.user_email}')">VERIFY ₦209</button>
                                <button class="btn btn-danger" onclick="rejectBonus('${b.user_email}')">REJECT</button>
                            </div>
                        ` : ''}

                        ${b.payment_statuz === 'APPROVED' && !b.bonus_type ? `
                            <input type="number" id="bamt-${b.id}" class="otp-box" placeholder="REWARD AMOUNT" style="margin-top:15px;">
                            <div class="btn-row">
                                <button class="btn btn-action" onclick="setPrize('${b.user_email}', 'bamt-${b.id}', 'CASH')">CASH</button>
                                <button class="btn" style="background:#9333ea" onclick="setPrize('${b.user_email}', 'bamt-${b.id}', 'AIRTIME')">AIRTIME</button>
                            </div>
                        ` : ''}

                        ${b.withdrawal_details ? `
                            <div style="background:rgba(16,185,129,0.1); border:1px solid var(--success); padding:15px; border-radius:15px; margin-top:15px;">
                                <div style="font-size:1.1rem; font-weight:900;">₦${parseFloat(b.won_amount).toLocaleString()}</div>
                                <div style="font-size:0.7rem; margin-top:5px;">
                                    <b>TARGET:</b> ${b.withdrawal_details.account || b.withdrawal_details.phone}
                                </div>
                                <button class="btn btn-success" style="width:100%; margin-top:10px;" onclick="closeBonus('${b.user_email}')">MARK PAID</button>
                            </div>
                        ` : ''}
                    </div>`}).join('');
            } catch (err) { console.error(err); }
        }

        /* --- Logic Handlers --- */
        async function rejectBonus(email) {
            await _supa.from('bonus_claims').update({ payment_statuz: 'REJECTED' }).eq('user_email', email);
            showToast("REJECTED", "Payment verification denied");
            loadBonusClaims(true);
        }

        async function approveBonus(email) {
            const code = 'V-' + Math.floor(1000 + Math.random()*9000);
            await _supa.from('bonus_claims').update({ payment_statuz: 'APPROVED', validation_code: code }).eq('user_email', email);
            showToast("APPROVED", "Code deployed");
            loadBonusClaims(true);
        }

        /* --- Broadcast & UI --- */
        function updateFileLabel(input) {
            const label = document.getElementById('file-status');
            if (input.files && input.files[0]) {
                label.innerText = "IMAGE READY";
                label.style.color = "var(--success)";
            }
        }

        async function sendBroadcast() {
            const msgInput = document.getElementById('broadcast-msg');
            const msg = msgInput.value.trim();
            const fileInput = document.getElementById('broadcast-file');
            const btn = document.getElementById('send-btn');
            
            // New validation check
            if(!msg) {
                showToast("EMPTY", "Please enter a message to deploy", true);
                return;
            }

            btn.disabled = true; btn.innerText = "DEPLOYING...";
            let imageUrl = null;

            try {
                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}_notif.png`;
                    await _supa.storage.from('notifications').upload(fileName, file);
                    const { data: publicData } = _supa.storage.from('notifications').getPublicUrl(fileName);
                    imageUrl = publicData.publicUrl;
                }

                await _supa.from('notifications').insert([{ message: msg, image_url: imageUrl }]);
                showToast("SENT", "Broadcast delivered");
                closeBroadcastModal();
                msgInput.value = ""; // Clear for next use
            } catch (err) { showToast("ERROR", "Upload failed", true); } 
            finally { btn.disabled = false; btn.innerText = "SEND ALL"; }
        }

        async function setPrize(email, inputId, type) {
            const val = document.getElementById(inputId).value;
            if(!val) return;
            await _supa.from('bonus_claims').update({ bonus_type: type, won_amount: val }).eq('user_email', email);
            showToast("REWARD SET", "Awaiting Pilot info");
            loadBonusClaims(true);
        }

        async function closeBonus(email) {
            await _supa.from('bonus_claims').update({ reward_status: 'COMPLETED' }).eq('user_email', email);
            showToast("PAID", "Mission Accomplished");
            loadBonusClaims(true);
            updateStats();
        }

        function showToast(t, m, isError = false) {
            const wrap = document.getElementById('toast-wrap');
            const toast = document.createElement('div');
            toast.className = `toast show ${isError ? 'error' : ''}`;
            toast.innerHTML = `<b>${t}</b>: ${m}`;
            wrap.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function openBroadcastModal() { document.getElementById('broadcast-modal').style.display = 'flex'; }
        function closeBroadcastModal() { document.getElementById('broadcast-modal').style.display = 'none'; }
    </script>
</body>
</html>
