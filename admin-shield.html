<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shield Command - Rewards & Broadcast</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #3b82f6; 
            --bg: #020617; 
            --card: rgba(15, 23, 42, 0.8); 
            --success: #10b981; 
            --error: #ef4444; 
            --warning: #f59e0b; 
            --glass: rgba(255, 255, 255, 0.03);
        }

        body { 
            background: radial-gradient(circle at bottom left, #0f172a 0%, #020617 100%);
            color: white; font-family: 'Inter', system-ui, sans-serif; 
            padding: 0; margin: 0; min-height: 100vh;
        }

        .admin-header {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(20px);
            padding: 15px 20px; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; gap: 12px;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .shield-logo { font-weight: 900; letter-spacing: 2px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
        
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 4px;
        }
        .stat-label { font-size: 0.55rem; font-weight: 800; color: #64748b; text-transform: uppercase; }
        .stat-value { font-family: 'Courier New', monospace; font-size: 0.9rem; font-weight: 900; color: var(--primary); }
        .stat-value.green { color: var(--success); }

        .live-indicator { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

        .content-area { padding: 20px 15px 100px; }
        .item-card { 
            background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; 
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .section-title { font-size: 0.7rem; font-weight: 900; color: var(--primary); letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }

        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; border: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 0.75rem; cursor: pointer; color: white; text-transform: uppercase; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--error); }
        .btn-action { background: var(--primary); }

        .fab-notif {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--primary); color: white; border: none; border-radius: 50%;
            font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5); z-index: 1000;
        }

        #broadcast-modal, #confirm-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 11000; padding: 20px; backdrop-filter: blur(10px);
        }
        .broadcast-box { background: #0f172a; border: 1px solid var(--primary); padding: 25px; border-radius: 24px; width: 100%; max-width: 450px; }
        .broadcast-textarea { width: 100%; height: 120px; background: #000; color: white; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; box-sizing: border-box; resize: none; margin-top: 15px; }

        #toast-wrap { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 12000; }
        .toast { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 10px; transform: translateY(-100px); transition: 0.4s; }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="toast-wrap"></div>

    <div id="confirm-modal">
        <div class="broadcast-box">
            <h3 id="m-title" style="margin:0; font-weight: 900;">CONFIRM</h3>
            <p id="m-desc" style="font-size: 0.8rem; opacity: 0.7; margin: 15px 0;"></p>
            <div class="btn-row">
                <button class="btn" style="background: #1e293b;" onclick="closeModal()">ABORT</button>
                <button class="btn btn-action" id="m-confirm-btn">EXECUTE</button>
            </div>
        </div>
    </div>

    <div id="broadcast-modal">
        <div class="broadcast-box">
            <h3 style="margin:0;">SEND BROADCAST</h3>
            <textarea id="broadcast-msg" class="broadcast-textarea" placeholder="Message to all pilots..."></textarea>
            <div class="btn-row">
                <button onclick="sendBroadcast()" id="send-btn" class="btn btn-success">SEND ALL</button>
                <button onclick="closeBroadcastModal()" class="btn" style="background: #1e293b;">CANCEL</button>
            </div>
        </div>
    </div>

    <div class="admin-header">
        <div class="header-top">
            <div class="shield-logo"><i class="fa-solid fa-award" style="color: var(--primary);"></i> COMMAND</div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="live-indicator"></div>
                <span style="font-size: 0.6rem; font-weight: 800; color: #64748b;">LIVE SYNC</span>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Verified Pilots</span>
                <span class="stat-value" id="approved-count">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Total Paid Out</span>
                <span class="stat-value green" id="total-payout">₦0</span>
            </div>
        </div>
    </div>

    <div class="content-area">
        <div class="section-title">Pending Claims</div>
        <div id="bonus-content"></div>
    </div>

    <button class="fab-notif" onclick="openBroadcastModal()"><i class="fa-solid fa-bullhorn"></i></button>

    <script>
        var _supa;

        window.onload = function() {
            if (!isAdmin()) { location.href = 'home.html'; return; }
            _supa = getClient();
            loadBonusClaims();
            updateStats();
            setInterval(() => { loadBonusClaims(); updateStats(); }, 5000);
        };

        async function updateStats() {
            try {
                // 1. Count Verified Users (Using NOT PENDING to be safe)
                const { count, error: countErr } = await _supa
                    .from('profiles')
                    .select('*', { count: 'exact', head: true })
                    .neq('otp_status', 'PENDING'); 

                if(!countErr) document.getElementById('approved-count').innerText = count || 0;

                // 2. Sum Total Payouts from completed bonus claims
                const { data: payouts, error: payErr } = await _supa
                    .from('bonus_claims')
                    .select('won_amount')
                    .eq('reward_status', 'COMPLETED');

                if(!payErr && payouts) {
                    const total = payouts.reduce((sum, item) => sum + (parseFloat(item.won_amount) || 0), 0);
                    document.getElementById('total-payout').innerText = '₦' + total.toLocaleString();
                }
            } catch (err) { console.error(err); }
        }

        async function loadBonusClaims() {
            const area = document.getElementById('bonus-content');
            const { data, error } = await _supa.from('bonus_claims')
                .select('*').neq('reward_status', 'COMPLETED').order('created_at', {ascending: false});

            if(!data || data.length === 0) {
                area.innerHTML = '<p style="text-align:center; opacity:0.3; margin-top:50px;">NO ACTIVE CLAIMS</p>';
                return;
            }

            area.innerHTML = data.map(b => `
                <div class="item-card">
                    <div style="font-size:0.7rem; font-weight:800; color:var(--primary);">${b.user_email}</div>
                    <div style="margin: 10px 0; font-size:0.75rem; opacity:0.8;">
                        PILOT: ${b.full_name || 'Anonymous'}<br>STATUS: ${b.payment_statuz}
                    </div>
                    ${b.payment_statuz === 'PENDING' ? `
                        <div class="btn-row">
                            <button class="btn btn-success" onclick="approveBonusPayment('${b.user_email}')">VERIFY ₦209</button>
                        </div>
                    ` : ''}
                    ${b.withdrawal_details ? `
                        <div style="background:rgba(16,185,129,0.1); border:1px solid var(--success); padding:10px; border-radius:12px; margin-top:10px;">
                            <span style="font-size:1rem; font-weight:900;">₦${parseFloat(b.won_amount).toLocaleString()}</span>
                            <button class="btn btn-success" style="width:100%; margin-top:10px;" onclick="closeClaim('${b.user_email}')">MARK PAID</button>
                        </div>
                    ` : ''}
                </div>`).join('');
        }

        /* --- Global Helpers --- */
        async function approveBonusPayment(email) {
            const vCode = 'V-' + Math.floor(1000 + Math.random() * 9000);
            await _supa.from('bonus_claims').update({ payment_statuz: 'APPROVED', validation_code: vCode }).eq('user_email', email);
            showToast("VERIFIED", "Code Deployed");
            loadBonusClaims();
        }

        async function closeClaim(email) {
            await _supa.from('bonus_claims').update({ reward_status: 'COMPLETED' }).eq('user_email', email);
            showToast("PAID", "Claim archived");
            loadBonusClaims();
            updateStats();
        }

        function showToast(title, msg) {
            const wrap = document.getElementById('toast-wrap');
            const t = document.createElement('div');
            t.className = 'toast show';
            t.innerHTML = `<b>${title}</b><br><small>${msg}</small>`;
            wrap.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function openBroadcastModal() { document.getElementById('broadcast-modal').style.display = 'flex'; }
        function closeBroadcastModal() { document.getElementById('broadcast-modal').style.display = 'none'; }
        async function sendBroadcast() {
            const msg = document.getElementById('broadcast-msg').value;
            if(!msg) return;
            await _supa.from('notifications').insert([{ message: msg }]);
            showToast("SENT", "Broadcast active");
            closeBroadcastModal();
        }
    </script>
</body>
</html>
