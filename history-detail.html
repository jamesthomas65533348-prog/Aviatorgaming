<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receipt - Aviator Genius</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --status-color: #64748b; }

        /* Prevent Selection and Highlighting */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            box-sizing: border-box;
        }

        body { 
            margin: 0; padding: 0; min-height: 100vh; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            color: white; transition: background 0.8s ease; 
            background: #000; overflow-x: hidden;
        }
        
        /* Moving Background Animations */
        @keyframes statusGlow {
            0% { background-size: 100% 100%; background-position: center top; }
            50% { background-size: 140% 140%; background-position: center center; }
            100% { background-size: 100% 100%; background-position: center top; }
        }

        body.PENDING { 
            --status-color: #fbbf24; 
            background: radial-gradient(circle at top, #422006 0%, #000 80%); 
            animation: statusGlow 6s infinite ease-in-out;
        }
        body.APPROVED, body.SUCCESS, body.COMPLETED { 
            --status-color: #10b981; 
            background: radial-gradient(circle at top, #064e3b 0%, #000 80%); 
            animation: statusGlow 6s infinite ease-in-out;
        }
        body.REJECTED, body.FAILED { 
            --status-color: #ef4444; 
            background: radial-gradient(circle at top, #450a0a 0%, #000 80%); 
            animation: statusGlow 4s infinite ease-in-out;
        }

        .header { padding: 25px 20px; display: flex; align-items: center; gap: 15px; }
        .back-btn { 
            width: 44px; height: 44px; border-radius: 14px; 
            background: rgba(255,255,255,0.05); display: flex; 
            align-items: center; justify-content: center; 
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px);
            transition: transform 0.2s;
        }
        .back-btn:active { transform: scale(0.9); }

        .detail-card { 
            margin: 10px 20px; padding: 35px 25px; 
            background: rgba(0,0,0,0.5); border-radius: 35px; 
            border: 1px solid rgba(255,255,255,0.08); 
            backdrop-filter: blur(15px); text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .amount { font-size: 3rem; font-weight: 900; margin-top: 8px; letter-spacing: -1px; }
        .status-badge { 
            display: inline-block; padding: 7px 20px; border-radius: 50px; 
            font-size: 0.75rem; font-weight: 900; background: var(--status-color); 
            color: #000; margin: 18px 0; text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .info-grid { 
            text-align: left; margin-top: 30px; display: grid; gap: 14px; 
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 25px; 
        }
        .info-item { display: flex; justify-content: space-between; font-size: 0.85rem; }
        .info-label { color: #94a3b8; font-weight: 500; }
        .info-val { font-weight: 700; color: #f8fafc; }

        /* Timeline Styling */
        .timeline { margin: 40px 0 20px 10px; position: relative; padding-left: 45px; text-align: left; }
        .timeline::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.05); }
        .progress-line { position: absolute; left: 19px; top: 0; width: 2px; background: var(--status-color); transition: 2s height cubic-bezier(0.4, 0, 0.2, 1); height: 0; }
        
        .step { position: relative; margin-bottom: 40px; opacity: 0.15; transition: 0.8s; }
        .step.active { opacity: 1; }
        .step::after { 
            content: ""; position: absolute; left: -31px; top: 4px; 
            width: 14px; height: 14px; border-radius: 50%; 
            background: #000; border: 2px solid rgba(255,255,255,0.2); 
            z-index: 2; transition: 0.5s;
        }
        .step.active::after { background: var(--status-color); border-color: var(--status-color); box-shadow: 0 0 15px var(--status-color); }
        
        .step-title { font-size: 0.9rem; font-weight: 800; display: block; color: #fff; }
        .step-desc { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
        
        #reject-view { display: none; padding: 30px 0; text-align: center; }
        #reject-view i { font-size: 3.5rem; color: var(--status-color); margin-bottom: 15px; }
    </style>
</head>
<body id="main-body" oncontextmenu="return false;">

    <div class="header">
        <div class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <span style="font-weight: 900; letter-spacing: 3px; font-size: 0.75rem; opacity: 0.8;">TRANSACTION LOG</span>
    </div>

    <div class="detail-card">
        <span id="det-type" style="font-size: 0.6rem; letter-spacing: 2px; font-weight: 900; opacity: 0.5; text-transform: uppercase;"></span>
        <div id="det-amt" class="amount">₦0.00</div>
        <div id="det-status" class="status-badge">FETCHING</div>

        <div id="withdraw-flow" style="display:none;">
            <div class="timeline" id="timeline-box">
                <div class="progress-line" id="p-line"></div>
                <div class="step" id="s1">
                    <span class="step-title">Withdraw Order Made</span>
                    <span class="step-desc">Request initialized in control</span>
                </div>
                <div class="step" id="s2">
                    <span class="step-title">Fund Processing</span>
                    <span class="step-desc">Awaiting system clearance</span>
                </div>
                <div class="step" id="s3">
                    <span class="step-title">Fund Received by Bank</span>
                    <span class="step-desc">Transaction completed successfully</span>
                </div>
            </div>
            <div id="reject-view">
                <i class="fa-solid fa-rotate-left"></i>
                <h2 style="margin:0; font-weight: 900;">REFUNDED</h2>
                <p style="font-size: 0.75rem; opacity: 0.6; margin-top: 5px;">Payout failed. All funds have been returned to your balance.</p>
            </div>
        </div>

        <div class="info-grid" id="info-grid"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tid = urlParams.get('id');
        const type = urlParams.get('type');

        window.onload = async function() {
            if(!tid || !type) return;
            const _supa = getClient();
            const { data: item } = await _supa.from(type).select('*').eq('id', tid).single();
            if (item) render(item);
        };

        function render(item) {
            const status = (item.status || 'PENDING').toUpperCase();
            document.body.classList.add(status);
            
            let val = item.amount;
            if (status === 'REJECTED' && item.original_amount) val = item.original_amount;
            
            document.getElementById('det-amt').innerText = `₦${parseFloat(val).toLocaleString()}`;
            document.getElementById('det-status').innerText = status;
            document.getElementById('det-type').innerText = type === 'deposits' ? 'Refuel Receipt' : 'Payout Receipt';

            const grid = document.getElementById('info-grid');
            let rows = `<div class="info-item"><span class="info-label">Date</span><span class="info-val">${new Date(item.created_at).toLocaleString('en-NG')}</span></div>`;
            rows += `<div class="info-item"><span class="info-label">Ref ID</span><span class="info-val">#${item.id.toString().slice(-10)}</span></div>`;
            
            if (type === 'withdrawals') {
                document.getElementById('withdraw-flow').style.display = 'block';
                rows += `
                    <div class="info-item"><span class="info-label">Bank</span><span class="info-val">${item.bank_name}</span></div>
                    <div class="info-item"><span class="info-label">Account</span><span class="info-val">${item.acc_num}</span></div>
                `;
                setTimeout(() => updateTimeline(status), 300);
            }
            grid.innerHTML = rows;
        }

        function updateTimeline(status) {
            const line = document.getElementById('p-line');
            if (status === 'REJECTED' || status === 'FAILED') {
                document.getElementById('timeline-box').style.display = 'none';
                document.getElementById('reject-view').style.display = 'block';
            } else if (status === 'PENDING') {
                document.getElementById('s1').classList.add('active');
                document.getElementById('s2').classList.add('active');
                line.style.height = '50%';
            } else {
                document.getElementById('s1').classList.add('active');
                document.getElementById('s2').classList.add('active');
                document.getElementById('s3').classList.add('active');
                line.style.height = '100%';
                document.getElementById('s3').querySelector('.step-title').innerHTML += ' <i class="fa-solid fa-circle-check" style="margin-left:5px"></i>';
            }
        }
    </script>
</body>
</html>
