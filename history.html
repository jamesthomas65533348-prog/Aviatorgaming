<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flight Logs - Aviator Genius</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #007bff; 
            --bg: #010409; 
            --accent: #0f172a;
            --card-glass: rgba(15, 23, 42, 0.6);
            --success: #10b981; 
            --warning: #fbbf24; 
            --error: #f43f5e; 
            --text-muted: #64748b;
            --gold: #ffcc00;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body { 
            background: radial-gradient(circle at top, var(--accent) 0%, var(--bg) 100%);
            color: white; font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 0; min-height: 100vh;
            transition: background 0.5s ease;
        }

        /* --- BOUNCY --- */
        .bouncy {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .bouncy:active { transform: scale(0.92); }

        /* --- HEADER --- */
        .history-header {
            padding: 15px 20px; display: flex; align-items: center;
            background: rgba(1, 4, 9, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 100;
        }

        .back-btn {
            width: 44px; height: 44px; border-radius: 14px;
            background: rgba(255,255,255,0.03); display: flex;
            align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* --- TABS --- */
        .tab-wrapper { padding: 20px; }
        .tabs { 
            display: flex; background: rgba(0,0,0,0.4); border-radius: 20px; 
            padding: 6px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .tab { 
            flex: 1; padding: 14px; text-align: center; border-radius: 15px; 
            font-size: 0.75rem; font-weight: 800; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px;
        }
        .tab.active { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        /* --- LOG LIST --- */
        .history-list { 
            display: flex; flex-direction: column; gap: 15px; 
            padding: 0 20px 100px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .log-card { 
            background: var(--card-glass); padding: 20px; border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.03); display: flex; 
            justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .log-card::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--primary); opacity: 0.5;
        }
        
        .log-info { display: flex; flex-direction: column; gap: 6px; }
        .meta-tag { 
            font-size: 0.55rem; font-weight: 900; letter-spacing: 1.2px; 
            text-transform: uppercase; display: flex; align-items: center; gap: 6px;
        }
        .amount-text { font-weight: 900; font-size: 1.3rem; letter-spacing: -0.5px; color: #fff; }
        .date-text { font-size: 0.6rem; color: var(--text-muted); font-weight: 600; }
        
        .bank-pill {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.55rem; color: #94a3b8; margin-top: 5px;
            background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .status-pill { 
            font-size: 0.6rem; font-weight: 900; padding: 6px 12px;
            border-radius: 10px; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .st-PENDING { background: rgba(251, 191, 36, 0.1); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.2); }
        .st-SUCCESS, .st-COMPLETED, .st-APPROVED { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .st-FAILED, .st-REJECTED { background: rgba(244, 63, 94, 0.1); color: var(--error); border: 1px solid rgba(244, 63, 94, 0.2); }

        .refund-note { font-size: 0.5rem; color: var(--error); margin-top: 8px; font-weight: 800; display: block; text-align: right; }
        
        .loader-ring { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.05); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 80px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; margin-top: 100px; }
        .empty-state i { font-size: 3rem; color: var(--accent); margin-bottom: 15px; display: block; }
        .empty-state p { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body>

    <div class="history-header">
        <div class="back-btn bouncy" onclick="location.href='home.html'"><i class="fa-solid fa-arrow-left"></i></div>
        <div style="font-weight: 900; letter-spacing: 3px; font-size: 0.7rem; margin-left: 20px; color: var(--primary);">FLIGHT LOGS</div>
    </div>

    <div class="tab-wrapper">
        <div class="tabs">
            <div class="tab active bouncy" id="tab-dep" onclick="switchTab('deposits')">Refuels</div>
            <div class="tab bouncy" id="tab-wit" onclick="switchTab('withdrawals')">Payouts</div>
        </div>
    </div>

    <div id="history-container" class="history-list"></div>

    <script>
        var _supa;
        var userEmail = localStorage.getItem('user_email');

        window.onload = function() {
            _supa = getClient();
            loadHistory('deposits');
        };

        function switchTab(type) {
            const isDep = type === 'deposits';
            document.getElementById('tab-dep').classList.toggle('active', isDep);
            document.getElementById('tab-wit').classList.toggle('active', !isDep);
            
            // Physical theme shift
            const themeColor = isDep ? '#007bff' : '#f43f5e';
            document.documentElement.style.setProperty('--primary', themeColor);
            
            loadHistory(type);
        }

        async function loadHistory(table) {
            const container = document.getElementById('history-container');
            container.innerHTML = '<div class="loader-ring"></div>';

            const { data, error } = await _supa.from(table)
                .select('*')
                .eq('email', userEmail)
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                container.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-cloud-moon"></i>
                    <p>No activity logged yet.</p>
                </div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                const status = (item.status || 'PENDING').toUpperCase();
                let typeLabel = table === 'deposits' ? 'Station Top-up' : 'Bank Payout';
                let typeIcon = table === 'deposits' ? 'fa-gas-pump' : 'fa-building-columns';
                let labelColor = "color: var(--text-muted)";

                if (table === 'deposits' && (item.flw_ref || status === 'COMPLETED')) {
                    typeLabel = 'Instant Refuel';
                    typeIcon = 'fa-bolt';
                    labelColor = "color: var(--gold)";
                }

                return `
                <div class="log-card">
                    <div class="log-info">
                        <span class="meta-tag" style="${labelColor}">
                            <i class="fa-solid ${typeIcon}"></i> ${typeLabel}
                        </span>
                        <span class="amount-text">₦${parseFloat(item.amount).toLocaleString()}</span>
                        <span class="date-text">${new Date(item.created_at).toLocaleString('en-NG', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'})}</span>
                        ${item.bank_name ? `<div class="bank-pill"><i class="fa-solid fa-landmark"></i> ${item.bank_name}</div>` : ''}
                    </div>
                    <div style="text-align: right;">
                        <div class="status-pill st-${status}">${status}</div>
                        ${status === 'REJECTED' ? '<span class="refund-note"><i class="fa-solid fa-rotate-left"></i> REFUNDED</span>' : ''}
                    </div>
                </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
