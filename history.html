<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction Ledger - Aviator Genius</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #007bff; 
            --bg: #02050a; 
            --accent: #0a192f;
            --card: rgba(15, 23, 42, 0.6);
            --success: #10b981; 
            --warning: #fbbf24; 
            --error: #f43f5e; 
            --text-muted: #94a3b8;
            --gold: #ffcc00;
        }

        body { 
            background: radial-gradient(circle at top, var(--accent) 0%, var(--bg) 100%);
            color: white; font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 0; min-height: 100vh;
        }

        .history-header {
            padding: 20px; display: flex; align-items: center;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 0; z-index: 100;
        }

        .back-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255,255,255,0.05); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }

        .tab-container { padding: 20px; }
        .tabs { 
            display: flex; background: rgba(0,0,0,0.3); border-radius: 16px; 
            padding: 6px; border: 1px solid rgba(255,255,255,0.05);
        }
        .tab { 
            flex: 1; padding: 12px; text-align: center; border-radius: 12px; 
            cursor: pointer; font-size: 0.8rem; font-weight: 800; 
            transition: 0.3s; color: var(--text-muted); 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .tab.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3); }

        .history-list { display: flex; flex-direction: column; gap: 12px; padding: 0 20px 40px; }
        
        .item { 
            background: var(--card); padding: 18px; border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.05); display: flex; 
            justify-content: space-between; align-items: center; 
        }
        
        .item-left { display: flex; flex-direction: column; gap: 4px; }
        .type-tag { font-size: 0.6rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
        .amount { font-weight: 900; font-size: 1.2rem; font-family: 'Monaco', monospace; }
        .date { font-size: 0.65rem; color: var(--text-muted); }
        
        .bank-info {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.6rem; color: #64748b; margin-top: 4px;
            background: rgba(0,0,0,0.2); padding: 3px 7px; border-radius: 5px;
        }

        .status-badge { 
            font-size: 0.6rem; font-weight: 900; padding: 4px 8px;
            border-radius: 6px; text-transform: uppercase; letter-spacing: 1px;
        }
        
        .bg-PENDING { background: rgba(251, 191, 36, 0.1); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.2); }
        .bg-SUCCESS, .bg-COMPLETED, .bg-APPROVED { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .bg-FAILED, .bg-REJECTED { background: rgba(244, 63, 94, 0.1); color: var(--error); border: 1px solid rgba(244, 63, 94, 0.2); }

        .refund-tag { font-size: 0.5rem; color: var(--error); margin-top: 5px; display: block; font-weight: bold; }
        .loader { width: 25px; height: 25px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="history-header">
        <div class="back-btn" onclick="location.href='home.html'"><i class="fa-solid fa-chevron-left"></i></div>
        <div style="font-weight: 900; letter-spacing: 2px; font-size: 0.9rem; margin-left: 15px;">FLIGHT LOGS</div>
    </div>

    <div class="tab-container">
        <div class="tabs">
            <div class="tab active" id="tab-dep" onclick="switchTab('deposits')">Refuels</div>
            <div class="tab" id="tab-wit" onclick="switchTab('withdrawals')">Payouts</div>
        </div>
    </div>

    <div id="history-container" class="history-list"></div>

    <script>
        var _supa;
        var userEmail = localStorage.getItem('user_email');

        window.onload = function() {
            _supa = getClient();
            loadHistory('deposits');
        };

        function switchTab(type) {
            document.getElementById('tab-dep').classList.toggle('active', type === 'deposits');
            document.getElementById('tab-wit').classList.toggle('active', type === 'withdrawals');
            document.documentElement.style.setProperty('--primary', type === 'deposits' ? '#007bff' : '#f43f5e');
            loadHistory(type);
        }

        async function loadHistory(table) {
            const container = document.getElementById('history-container');
            container.innerHTML = '<div class="loader"></div>';

            const { data, error } = await _supa.from(table)
                .select('*')
                .eq('email', userEmail)
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; opacity:0.5; margin-top:50px;">No records found.</p>';
                return;
            }

            container.innerHTML = data.map(item => {
                const status = (item.status || 'PENDING').toUpperCase();
                
                // Automation Tag Logic
                let typeLabel = table === 'deposits' ? 'Manual Top-up' : 'Bank Payout';
                let typeIcon = table === 'deposits' ? 'fa-wallet' : 'fa-building-columns';
                let labelStyle = "color: var(--text-muted)";

                if (table === 'deposits' && (item.flw_ref || status === 'COMPLETED')) {
                    typeLabel = 'Instant Auto-Refuel';
                    typeIcon = 'fa-bolt';
                    labelStyle = "color: var(--gold)";
                }

                return `
                <div class="item">
                    <div class="item-left">
                        <span class="type-tag" style="${labelStyle}">
                            <i class="fa-solid ${typeIcon}"></i> ${typeLabel}
                        </span>
                        <span class="amount">₦${parseFloat(item.amount).toLocaleString()}</span>
                        <span class="date">${new Date(item.created_at).toLocaleString()}</span>
                        ${item.bank_name ? `<div class="bank-info">${item.bank_name}</div>` : ''}
                    </div>
                    <div style="text-align: right;">
                        <div class="status-badge bg-${status}">${status}</div>
                        ${status === 'REJECTED' ? '<span class="refund-tag">REFUNDED TO WALLET</span>' : ''}
                    </div>
                </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
