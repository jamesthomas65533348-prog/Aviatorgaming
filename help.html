<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Support - Gaming Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #ff0044; 
            --bg: #0d1117; 
            --chat-user: #1f6feb; 
            --chat-agent: #21262d; 
            --accent: #00f2ff;
        }

        /* Prevent selection and highlights */
        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-select: none; 
            box-sizing: border-box; 
            outline: none;
        }

        body { 
            background: radial-gradient(circle at top right, #161b22 0%, #0d1117 100%);
            color: white; font-family: 'Inter', sans-serif; 
            margin: 0; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; 
        }

        /* Bouncy Animations */
        .bouncy { transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .bouncy:active { transform: scale(0.9); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; border: 1.5px solid var(--primary) !important; }

        /* Header */
        .header { 
            padding: 15px 20px; background: rgba(22, 27, 34, 0.8); 
            backdrop-filter: blur(20px); display: flex; 
            align-items: center; justify-content: space-between; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10; 
        }
        .agent-info { display: flex; align-items: center; gap: 12px; }
        .avatar { 
            width: 42px; height: 42px; border-radius: 14px; 
            background: #30363d; border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 68, 0.3);
        }
        .status-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 8px #2ecc71; }

        /* Chat Area */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { 
            max-width: 85%; padding: 12px 16px; border-radius: 20px; 
            font-size: 0.9rem; line-height: 1.4; position: relative; 
            word-wrap: break-word; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .msg-user { align-self: flex-end; background: var(--chat-user); border-bottom-right-radius: 4px; color: white; box-shadow: 0 4px 15px rgba(31, 111, 235, 0.2); }
        .msg-agent { align-self: flex-start; background: var(--chat-agent); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .msg img { max-width: 100%; border-radius: 12px; margin-top: 5px; display: block; }

        /* Image Preview Area */
        #pending-image-container { 
            display: none; padding: 10px 20px; background: rgba(0,0,0,0.3); 
            border-top: 1px solid rgba(255,255,255,0.05); align-items: center; gap: 15px;
        }
        .preview-wrapper { position: relative; width: 60px; height: 60px; }
        #image-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; border: 1px solid var(--accent); }
        .remove-img { 
            position: absolute; top: -8px; right: -8px; background: var(--primary); 
            color: white; border-radius: 50%; width: 20px; height: 20px; 
            display: flex; align-items: center; justify-content: center; font-size: 10px; 
        }

        /* Input Area */
        .input-area { 
            padding: 15px; background: #0d1117; display: flex; 
            align-items: center; gap: 12px; border-top: 1px solid rgba(255,255,255,0.05);
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        #msg-input { 
            flex: 1; background: rgba(255,255,255,0.04); border: 1px solid #30363d; 
            padding: 12px 18px; border-radius: 20px; color: white; 
            transition: 0.3s; font-size: 0.95rem;
        }
        .icon-btn { font-size: 1.5rem; color: #8b949e; display: flex; align-items: center; justify-content: center; }

        /* Modal */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(10px);
            padding: 20px;
        }
        .modal-content { 
            background: #161b22; padding: 30px; border-radius: 30px; 
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); 
            width: 100%; max-width: 350px; animation: modalBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalBounce { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .btn-end { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 15px; font-weight: 800; cursor: pointer; flex: 1; }
        .btn-cancel { background: rgba(255,255,255,0.05); color: #8b949e; border: none; padding: 14px; border-radius: 15px; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

<div class="header">
    <div class="agent-info">
        <div class="avatar" style="background: url('https://ui-avatars.com/api/?name=Gaming+Agent&background=ff0044&color=fff') center/cover;"></div>
        <div>
            <div style="font-weight: 900; letter-spacing: 0.5px;">Gaming Agent</div>
            <div style="font-size: 0.7rem; color: #8b949e; font-weight: 600;"><span class="status-dot"></span>LIVE SUPPORT</div>
        </div>
    </div>
    <button class="bouncy" onclick="confirmEnd()" style="background:rgba(255,0,68,0.1); border: 1px solid var(--primary); color:var(--primary); padding: 8px 15px; border-radius: 12px; font-size: 0.75rem; font-weight: 900; letter-spacing: 1px;">END SESSION</button>
</div>

<div id="chat-window"></div>

<div id="pending-image-container">
    <div class="preview-wrapper">
        <img id="image-preview" src="">
        <div class="remove-img bouncy" onclick="clearImage()"><i class="fa-solid fa-x"></i></div>
    </div>
    <div style="font-size: 0.75rem; color: #8b949e;">Image attached. Press send to upload.</div>
</div>

<div class="input-area">
    <label class="icon-btn bouncy">
        <i class="fa-solid fa-camera"></i>
        <input type="file" id="img-upload" hidden accept="image/*" onchange="previewImage(this)">
    </label>
    <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
    <div class="icon-btn bouncy" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane" style="color: var(--primary);"></i>
    </div>
</div>

<div id="end-modal" class="modal">
    <div class="modal-content">
        <div style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"><i class="fa-solid fa-circle-exclamation"></i></div>
        <h3 style="margin:0; letter-spacing: 1px;">END SESSION?</h3>
        <p style="color: #8b949e; font-size: 0.85rem; margin: 15px 0 25px; line-height: 1.5;">All message history will be wiped from our secure servers immediately.</p>
        <div style="display:flex; gap:12px;">
            <button onclick="closeModal()" class="btn-cancel bouncy">Go Back</button>
            <button onclick="endSession()" class="btn-end bouncy">End Now</button>
        </div>
    </div>
</div>

<script>
    const _supa = getClient();
    const myEmail = localStorage.getItem('user_email');
    const chatWin = document.getElementById('chat-window');
    let pendingFile = null;
    let isAutoReplyTriggered = false;

    window.onload = () => {
        if(!myEmail) { location.href = 'index.html'; return; }
        loadChatHistory();
    };

    async function loadChatHistory() {
        const { data } = await _supa.from('chats')
            .select('*')
            .or(`sender_email.eq.${myEmail},recipient_role.eq.${myEmail}`)
            .order('created_at', { ascending: true });

        if (data && data.length > 0) {
            isAutoReplyTriggered = true; // History exists, don't trigger auto-reply again
            data.forEach(msg => appendMessage(msg));
        }
    }

    // Realtime Listener
    _supa.channel('user_chat_room')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, payload => {
        const msg = payload.new;
        if (msg.recipient_role === myEmail || (msg.sender_email === myEmail && !document.getElementById(`msg-${msg.id}`))) {
            appendMessage(msg);
        }
    }).subscribe();

    function previewImage(input) {
        if (input.files && input.files[0]) {
            pendingFile = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('pending-image-container').style.display = 'flex';
            };
            reader.readAsDataURL(pendingFile);
        }
    }

    function clearImage() {
        pendingFile = null;
        document.getElementById('img-upload').value = '';
        document.getElementById('pending-image-container').style.display = 'none';
    }

    async function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();

        // VALIDATION: Shake if both are empty
        if (!text && !pendingFile) {
            input.classList.add('shake');
            setTimeout(() => input.classList.remove('shake'), 3000);
            return;
        }

        const currentText = text;
        const currentFile = pendingFile;
        
        // Reset UI immediately
        input.value = '';
        clearImage();

        let uploadedUrl = null;

        // Handle Image Upload if exists
        if (currentFile) {
            const path = `uploads/${Date.now()}_${currentFile.name}`;
            const { data: uploadData } = await _supa.storage.from('chats').upload(path, currentFile);
            if (uploadData) {
                const { data: urlData } = _supa.storage.from('chats').getPublicUrl(path);
                uploadedUrl = urlData.publicUrl;
            }
        }

        // Insert to DB
        await _supa.from('chats').insert([{ 
            sender_email: myEmail, 
            message: currentText, 
            image_url: uploadedUrl,
            recipient_role: 'admin',
            is_read: false
        }]);

        // Automated First-Response Logic
        if (!isAutoReplyTriggered) {
            isAutoReplyTriggered = true;
            setTimeout(async () => {
                await _supa.from('chats').insert([{ 
                    sender_email: 'System',
                    message: "Thanks for reaching out, our system has saved your requests and you are in the queue, a live agent is coming your way within the next 3-5 hours due to heavy assistant request", 
                    recipient_role: myEmail,
                    is_read: false
                }]);
            }, 1500);
        }
    }

    function appendMessage(data) {
        if (data.id && document.getElementById(`msg-${data.id}`)) return;

        const isMe = data.sender_email === myEmail;
        const div = document.createElement('div');
        if(data.id) div.id = `msg-${data.id}`;
        div.className = `msg ${isMe ? 'msg-user' : 'msg-agent'}`;
        
        let content = '';
        if(data.image_url) content += `<img src="${data.image_url}" onclick="window.open('${data.image_url}')">`;
        if(data.message) content += `<div>${data.message}</div>`;
        
        div.innerHTML = content;
        chatWin.appendChild(div);
        chatWin.scrollTo({ top: chatWin.scrollHeight, behavior: 'smooth' });
    }

    function confirmEnd() { document.getElementById('end-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('end-modal').style.display = 'none'; }

    async function endSession() {
        await _supa.from('chats').delete().or(`sender_email.eq.${myEmail},recipient_role.eq.${myEmail}`);
        location.reload(); 
    }

    document.getElementById('msg-input').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
