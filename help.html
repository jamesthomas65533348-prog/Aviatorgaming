<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Terminal Support - Aviator Genius</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #ff0044; 
            --bg: #050505; 
            --chat-user: #007bff; 
            --chat-agent: #121212; 
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        /* --- UI LOCK PROTOCOL --- */
        * { 
            -webkit-tap-highlight-color: transparent !important; 
            user-select: none !important; 
            box-sizing: border-box; 
            outline: none;
        }

        body { 
            background: var(--bg);
            color: white; font-family: 'Inter', sans-serif; 
            margin: 0; display: flex; flex-direction: column; 
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .header { 
            padding: 20px; background: rgba(5, 5, 5, 0.9); 
            backdrop-filter: blur(20px); display: flex; 
            align-items: center; justify-content: space-between; 
            border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 100; 
        }

        .agent-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { 
            width: 44px; height: 44px; border-radius: 15px; 
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 68, 0.2);
            background: #111; display: flex; align-items: center; justify-content: center;
        }
        .status-dot { width: 8px; height: 8px; background: #00ffa3; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 10px #00ffa3; }

        #chat-window { 
            flex: 1; padding: 25px 20px; display: flex; flex-direction: column; gap: 18px; 
            min-height: calc(100vh - 160px);
        }

        .msg { 
            max-width: 82%; padding: 14px 18px; border-radius: 22px; 
            font-size: 0.85rem; line-height: 1.5; position: relative; 
            word-wrap: break-word; animation: msgPop 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            font-weight: 500;
        }
        @keyframes msgPop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-user { 
            align-self: flex-end; background: var(--chat-user); 
            border-bottom-right-radius: 4px; color: white;
            box-shadow: 0 10px 20px rgba(0, 123, 255, 0.2);
        }
        .msg-agent { 
            align-self: flex-start; background: var(--chat-agent); 
            border-bottom-left-radius: 4px; border: 1px solid var(--border);
            color: #eee;
        }
        .msg img { max-width: 100%; border-radius: 14px; margin: 8px 0; display: block; border: 1px solid var(--border); }

        #pending-image-container { 
            display: none; padding: 15px 20px; background: #000; 
            border-top: 1px solid var(--border); align-items: center; gap: 15px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .preview-box { position: relative; width: 55px; height: 55px; }
        #image-preview { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 1px solid var(--primary); }
        .remove-trigger { 
            position: absolute; top: -8px; right: -8px; background: var(--primary); 
            color: white; border-radius: 50%; width: 22px; height: 22px; 
            display: flex; align-items: center; justify-content: center; font-size: 10px; border: 2px solid #000;
        }

        .input-area { 
            position: sticky; bottom: 0; padding: 15px 20px; 
            background: rgba(5,5,5,0.95); backdrop-filter: blur(15px);
            display: flex; align-items: center; gap: 15px; 
            border-top: 1px solid var(--border);
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            z-index: 90;
        }
        
        #msg-input { 
            flex: 1; background: var(--glass); border: 1px solid var(--border); 
            padding: 14px 20px; border-radius: 25px; color: white; 
            font-size: 16px; transition: 0.3s;
        }
        #msg-input:focus { border-color: var(--primary); background: rgba(255,255,255,0.06); }
        
        .action-icon { font-size: 1.4rem; color: #555; transition: 0.2s; }
        .action-icon:active { transform: scale(0.9); color: var(--primary); }

        /* --- MODAL ENGINE --- */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(10px);
            padding: 20px;
        }
        .modal-content { 
            background: #0a0a0f; padding: 40px 30px; border-radius: 35px; 
            text-align: center; border: 1px solid var(--border); 
            width: 100%; max-width: 340px;
        }
        .btn-confirm { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 18px; font-weight: 900; width: 100%; letter-spacing: 1px; }
        .btn-abort { background: var(--glass); color: #555; border: none; padding: 16px; border-radius: 18px; width: 100%; font-weight: 900; margin-top: 10px; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .input-error { animation: shake 0.3s ease-in-out; border-color: var(--primary) !important; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="header">
    <div class="agent-profile">
        <div class="avatar">
            <i class="fa-solid fa-user-shield" style="color: var(--primary);"></i>
        </div>
        <div>
            <div style="font-weight: 900; letter-spacing: 1px; font-size: 0.85rem;">Flight Engineer</div>
            <div style="font-size: 0.6rem; color: #555; font-weight: 800; letter-spacing: 1px;"><span class="status-dot"></span>TERMINAL_ACTIVE</div>
        </div>
    </div>
    <div onclick="confirmEnd()" style="background: rgba(255,0,68,0.1); border: 1px solid var(--primary); color: var(--primary); padding: 8px 15px; border-radius: 12px; font-size: 0.65rem; font-weight: 900; letter-spacing: 1.5px;">DISCONNECT</div>
</div>

<div id="chat-window"></div>

<div id="pending-image-container">
    <div class="preview-box">
        <img id="image-preview" src="">
        <div class="remove-trigger" onclick="clearImage()"><i class="fa-solid fa-x"></i></div>
    </div>
    <div style="font-size: 0.65rem; color: #555; font-weight: 700; letter-spacing: 0.5px;">ENCRYPTED_ATTACHMENT_READY</div>
</div>

<div class="input-area" id="footer-input">
    <label class="action-icon">
        <i class="fa-solid fa-camera-retro"></i>
        <input type="file" id="img-upload" hidden accept="image/*" onchange="previewImage(this)">
    </label>
    <input type="text" id="msg-input" placeholder="Type transmission..." autocomplete="off">
    <div class="action-icon" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane" style="color: var(--primary);"></i>
    </div>
</div>

<div id="end-modal" class="modal">
    <div class="modal-content">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;"></i>
        <h3 style="margin:0; letter-spacing: 2px; font-weight: 900;">WIPE TERMINAL?</h3>
        <p style="color: #555; font-size: 0.75rem; margin: 15px 0 30px; line-height: 1.6; font-weight: 600;">Disconnecting will securely erase all local transmission logs. This action cannot be undone.</p>
        <button onclick="endSession()" class="btn-confirm">WIPE & LOGOUT</button>
        <button onclick="closeModal()" class="btn-abort">STAY CONNECTED</button>
    </div>
</div>

<script>
    const _supa = getClient();
    const myEmail = localStorage.getItem('user_email');
    const chatWin = document.getElementById('chat-window');
    const msgInput = document.getElementById('msg-input');
    let pendingFile = null;
    let isAutoReplyTriggered = false;

    window.onload = () => {
        if(!myEmail) { location.href = 'index.html'; return; }
        loadChatHistory();
    };

    // Huawei Y10 Soft-Keyboard Handling
    msgInput.addEventListener('focus', () => {
        setTimeout(() => {
            window.scrollTo(0, document.body.scrollHeight);
        }, 300);
    });

    async function loadChatHistory() {
        const { data } = await _supa.from('chats')
            .select('*')
            .or(`sender_email.eq.${myEmail},recipient_role.eq.${myEmail}`)
            .order('created_at', { ascending: true });

        if (data && data.length > 0) {
            isAutoReplyTriggered = true;
            data.forEach(msg => appendMessage(msg));
        }
    }

    _supa.channel('terminal_sync')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, payload => {
        const msg = payload.new;
        if (msg.recipient_role === myEmail || (msg.sender_email === myEmail && !document.getElementById(`msg-${msg.id}`))) {
            appendMessage(msg);
        }
    }).subscribe();

    function previewImage(input) {
        if (input.files && input.files[0]) {
            pendingFile = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('pending-image-container').style.display = 'flex';
            };
            reader.readAsDataURL(pendingFile);
        }
    }

    function clearImage() {
        pendingFile = null;
        document.getElementById('img-upload').value = '';
        document.getElementById('pending-image-container').style.display = 'none';
    }

    async function sendMessage() {
        const text = msgInput.value.trim();

        if (!text && !pendingFile) {
            msgInput.classList.add('input-error');
            setTimeout(() => msgInput.classList.remove('input-error'), 500);
            return;
        }

        const currentText = text;
        const currentFile = pendingFile;
        
        msgInput.value = '';
        clearImage();

        let uploadedUrl = null;
        if (currentFile) {
            const path = `terminal_uploads/${Date.now()}_${currentFile.name}`;
            const { data: uploadData } = await _supa.storage.from('chats').upload(path, currentFile);
            if (uploadData) {
                const { data: urlData } = _supa.storage.from('chats').getPublicUrl(path);
                uploadedUrl = urlData.publicUrl;
            }
        }

        await _supa.from('chats').insert([{ 
            sender_email: myEmail, 
            message: currentText, 
            image_url: uploadedUrl,
            recipient_role: 'admin',
            is_read: false
        }]);

        if (!isAutoReplyTriggered) {
            isAutoReplyTriggered = true;
            setTimeout(async () => {
                await _supa.from('chats').insert([{ 
                    sender_email: 'Terminal_Auto',
                    message: "Transmission received. You have been placed in the verification queue. Current wait time: 3-5 hours due to high signal volume. Do not disconnect.", 
                    recipient_role: myEmail,
                    is_read: false
                }]);
            }, 2000);
        }
    }

    function appendMessage(data) {
        if (data.id && document.getElementById(`msg-${data.id}`)) return;

        const isMe = data.sender_email === myEmail;
        const div = document.createElement('div');
        if(data.id) div.id = `msg-${data.id}`;
        div.className = `msg ${isMe ? 'msg-user' : 'msg-agent'}`;
        
        let content = '';
        if(data.image_url) content += `<img src="${data.image_url}" onclick="window.open('${data.image_url}')">`;
        if(data.message) content += `<div>${data.message}</div>`;
        
        div.innerHTML = content;
        chatWin.appendChild(div);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function confirmEnd() { document.getElementById('end-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('end-modal').style.display = 'none'; }

    async function endSession() {
        await _supa.from('chats').delete().or(`sender_email.eq.${myEmail},recipient_role.eq.${myEmail}`);
        location.reload(); 
    }

    msgInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
